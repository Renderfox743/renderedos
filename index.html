<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>RenderedOS 3.0</title>
<style>
  :root{--bg:#0a0b0e;--fg:#c8ccd4;--dim:#565d6b;--accent:#7aa2f7;--green:#9ece6a;--red:#f7768e;--yellow:#e0af68;--purple:#bb9af7;--cyan:#7dcfff;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(1200px 500px at 50% -20%,rgba(122,162,247,.06),transparent 70%)}
  #screen{position:fixed;inset:0;padding:18px 22px 40px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#20242c transparent;white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch}
  #screen::-webkit-scrollbar{width:8px}
  #screen::-webkit-scrollbar-track{background:transparent}
  #screen::-webkit-scrollbar-thumb{background:#20242c;border-radius:4px}
  .line{min-height:1.5em}
  #inputline{display:flex;align-items:baseline;gap:0}
  #prompt{white-space:pre;flex:0 0 auto}
  #cmd{flex:1 1 auto;min-width:0;background:transparent;border:0;outline:0;padding:0;margin:0;color:var(--fg);font:inherit;line-height:inherit;caret-color:var(--accent)}
  #cmd::selection{background:rgba(122,162,247,.3)}
  @media (max-width:600px){body{font-size:12px}#screen{padding:12px 12px 40px}}
  #nano{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;font-family:inherit;font-size:14px}
  #nano.visible{display:flex}
  #nano .bar{background:#c8ccd4;color:#0a0b0e;padding:2px 8px;font-weight:600;display:flex;justify-content:space-between;white-space:pre;overflow:hidden}
  #nano .body{flex:1 1 auto;overflow:hidden;padding:8px 4px 8px 8px;display:flex}
  #nano .lines{flex:1 1 auto;overflow:hidden;display:flex}
  #nano .gutter{color:var(--dim);text-align:right;padding-right:10px;border-right:1px solid #1c1f26;margin-right:10px;white-space:pre;line-height:1.5}
  #nano .text{flex:1 1 auto;white-space:pre;overflow:hidden;line-height:1.5}
  #nano .cursor{display:inline-block;width:8px;background:var(--accent);color:var(--bg);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #nano .status{color:var(--dim);text-align:right;padding:4px 8px;border-top:1px solid #1c1f26;white-space:pre}
  #nano .hint{background:#c8ccd4;color:#0a0b0e;padding:2px 8px;font-weight:600;white-space:pre;overflow:hidden}
  #nano .hint .k{background:#0a0b0e;color:#c8ccd4;padding:0 4px;font-weight:700}
</style>
</head>
<body>
<div id="screen">

var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pad(s,n){return String(s).padEnd(n);}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

/* ANSI -> HTML */
var FG={30:'#3b4048',31:'#f7768e',32:'#9ece6a',33:'#e0af68',34:'#7aa2f7',35:'#bb9af7',36:'#7dcfff',37:'#c8ccd4',90:'#565d6b',91:'#ff8fa3',92:'#b9f27c',93:'#f5c97b',94:'#9ab8ff',95:'#d0b0ff',96:'#9fe0ff',97:'#ffffff'};
var BG={40:'#3b4048',41:'#f7768e',42:'#9ece6a',43:'#e0af68',44:'#7aa2f7',45:'#bb9af7',46:'#7dcfff',47:'#c8ccd4',100:'#565d6b',101:'#ff8fa3',102:'#b9f27c',103:'#f5c97b',104:'#9ab8ff',105:'#d0b0ff',106:'#9fe0ff',107:'#ffffff'};
function sWrap(t,st){
  if(!t)return '';
  var c='';
  if(st.fg)c+='color:'+st.fg+';';
  if(st.bg)c+='background:'+st.bg+';';
  if(st.bold)c+='font-weight:600;';
  if(st.italic)c+='font-style:italic;';
  if(st.underline)c+='text-decoration:underline;';
  if(st.dim)c+='opacity:.55;';
  var b=escHtml(t);
  return c?'<span style="'+c+'">'+b+'</span>':b;
}
function renderAnsi(str){
  str=String(str==null?'':str);
  var st={fg:null,bg:null,bold:false,dim:false,italic:false,underline:false};
  var html='';
  var rest=str;
  var re=/\x1b\[([0-9;]*)m/;
  while(rest.length){
    var m=re.exec(rest);
    if(!m){html+=sWrap(rest,st);break;}
    if(m.index>0)html+=sWrap(rest.slice(0,m.index),st);
    var codes=m[1].split(';').map(function(x){return x===''?0:parseInt(x,10);});
    for(var i=0;i<codes.length;i++){
      var c=codes[i];
      if(c===0){st.fg=null;st.bg=null;st.bold=false;st.dim=false;st.italic=false;st.underline=false;}
      else if(c===1)st.bold=true;
      else if(c===2)st.dim=true;
      else if(c===3)st.italic=true;
      else if(c===4)st.underline=true;
      else if(c===22){st.bold=false;st.dim=false;}
      else if(c===23)st.italic=false;
      else if(c===24)st.underline=false;
      else if(c===39)st.fg=null;
      else if(c===49)st.bg=null;
      else if(FG[c])st.fg=FG[c];
      else if(BG[c])st.bg=BG[c];
    }
    rest=rest.slice(m.index+m[0].length);
  }
  return html;
}

/* DOM */
var screenEl=document.getElementById('screen');
var outputEl=document.getElementById('output');
var inputEl=document.getElementById('cmd');
var promptEl=document.getElementById('prompt');
var inputLine=document.getElementById('inputline');
function scrollBottom(){screenEl.scrollTop=screenEl.scrollHeight;}
function print(text,cls){
  var s=String(text==null?'':text);
  if(s.endsWith('\n'))s=s.slice(0,-1);
  var parts=s.split('\n');
  var frag=document.createDocumentFragment();
  for(var i=0;i<parts.length;i++){
    var d=document.createElement('div');
    d.className='line'+(cls?' '+cls:'');
    d.innerHTML=renderAnsi(parts[i]);
    frag.appendChild(d);
  }
  outputEl.appendChild(frag);
  scrollBottom();
}
function clearScreen(){outputEl.innerHTML='';screenEl.scrollTop=0;}
function makeLive(){
  var d=document.createElement('div');
  d.className='line';
  outputEl.appendChild(d);
  return {set:function(t){d.innerHTML=renderAnsi(t);scrollBottom();},el:d};
}

/* ══════════ Persistence ══════════ */
var FS=null;

function ser(n){
  if(n.type==='file'){
    var o={t:'f',c:n.content,m:n.mtime,o:n.mode,u:n.owner,g:n.group};
    if(n.binary)o.b=true;
    return o;
  }
  var k={};
  for(var x in n.children){
    var c=n.children[x];
    if(c.ro)continue;
    k[x]=ser(c);
  }
  return {t:'d',m:n.mtime,o:n.mode,u:n.owner,g:n.group,k:k,ro:n.ro};
}
function deser(d){
  if(!d||typeof d!=='object')return null;
  if(d.t==='f')return F(d.c||'',{mtime:d.m||NOW,mode:d.o||'644',owner:d.u||'root',group:d.g||'root',binary:!!d.b});
  if(d.t==='d'){
    var k={};
    for(var x in (d.k||{}))k[x]=deser(d.k[x]);
    return Dir(k,{mtime:d.m||NOW,mode:d.o||'755',owner:d.u||'root',group:d.g||'root',ro:!!d.ro});
  }
  return null;
}
function mergeFS(base,saved){
  if(!saved||saved.type!=='dir'||base.type!=='dir')return base;
  for(var k in saved.children){
    var s=saved.children[k],b=base.children[k];
    if(!b)base.children[k]=s;
    else if(b.ro)continue;
    else if(b.type==='dir'&&s.type==='dir')mergeFS(b,s);
    else base.children[k]=s;
  }
  return base;
}
function saveFS(){
  try{
    var j=JSON.stringify(ser(FS));
    localStorage.setItem(K_FS,j);
    localStorage.setItem(K_META,JSON.stringify({version:VERSION,savedAt:Date.now(),bytes:j.length}));
    return true;
  }catch(e){console.warn('saveFS',e);return false;}
}
function loadFS(){
  try{
    var meta=JSON.parse(localStorage.getItem(K_META)||'null');
    if(meta&&meta.version!==VERSION){clearStorage();return false;}
    var raw=localStorage.getItem(K_FS);
    if(!raw)return false;
    var r=deser(JSON.parse(raw));
    if(r){FS=mergeFS(defaultFS(),r);return true;}
    return false;
  }catch(e){console.warn('loadFS',e);return false;}
}
function clearStorage(){
  try{
    localStorage.removeItem(K_FS);
    localStorage.removeItem(K_META);
    localStorage.removeItem(K_STATE);
  }catch(e){}
}

/* ══════════ Paths ══════════ */
function splitPath(p){return String(p).split('/').filter(Boolean);}
function resolvePath(cwd,p){
  if(p===undefined||p===null||p==='')return cwd;
  p=String(p);
  if(p==='~')p=HOME;
  else if(p.indexOf('~/')===0)p=HOME+p.slice(1);
  var parts=p.charAt(0)==='/'?[]:splitPath(cwd);
  var segs=splitPath(p);
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    if(s==='.')continue;
    if(s==='..'){parts.pop();continue;}
    parts.push(s);
  }
  return '/'+parts.join('/');
}
function getNode(path){
  var parts=splitPath(path);
  var n=FS;
  for(var i=0;i<parts.length;i++){
    if(!n||n.type!=='dir'||!n.children[parts[i]])return null;
    n=n.children[parts[i]];
  }
  return n;
}
function getParent(path){
  var parts=splitPath(path);
  var name=parts.pop();
  return {parent:getNode('/'+parts.join('/')),name:name};
}
function ensureDir(path){
  var parts=splitPath(path);
  var n=FS;
  for(var i=0;i<parts.length;i++){
    if(!n.children[parts[i]])n.children[parts[i]]=Dir({});
    n=n.children[parts[i]];
    if(n.type!=='dir')return null;
  }
  return n;
}
function writeFile(path,content,append){
  var gp=getParent(path);
  if(!gp.parent||gp.parent.type!=='dir'||gp.parent.ro)return false;
  var ex=gp.parent.children[gp.name];
  if(ex&&ex.type==='dir')return false;
  if(ex&&append){ex.content+=content;ex.mtime=Date.now();}
  else gp.parent.children[gp.name]=F(content,{mtime:Date.now()});
  return true;
}
function readFile(path){
  var n=getNode(path);
  if(!n||n.type!=='file')return null;
  return n.content;
}

/* ══════════ Config readers ══════════ */
function readHostname(){
  var c=readFile('/etc/hostname');
  if(!c)return null;
  return c.trim().split('\n')[0]||null;
}
function readPasswd(){
  var c=readFile('/etc/passwd');
  if(!c)return null;
  var lines=c.split('\n').filter(function(l){return l.trim()&&l.charAt(0)!=='#';});
  return lines.map(function(line){
    var p=line.split(':');
    return {name:p[0],pass:p[1],uid:+p[2],gid:+p[3],gecos:p[4],home:p[5],shell:p[6]};
  });
}
function readFstab(){
  var c=readFile('/etc/fstab');
  if(!c)return null;
  var lines=c.split('\n').filter(function(l){return l.trim()&&l.trim().charAt(0)!=='#';});
  return lines.map(function(line){
    var p=line.split(/\s+/);
    return {device:p[0],mount:p[1],type:p[2],options:p[3]||'defaults'};
  });
}
function readOsRelease(){
  var c=readFile('/etc/os-release');
  if(!c)return null;
  var o={};
  var lines=c.split('\n');
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(/^([A-Z_]+)="?([^"]*)"?$/);
    if(m)o[m[1]]=m[2];
  }
  return o;
}
function readMOTD(){
  return readFile('/etc/motd')||'';
}
function readSudoers(){
  var c=readFile('/etc/sudoers');
  if(!c)return [];
  return c.split('\n').filter(function(l){return l.trim()&&l.trim().charAt(0)!=='#';});
}
function userCanSudo(username){
  var lines=readSudoers();
  if(!lines.length)return false;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(new RegExp('^'+username+'\\s+ALL=').test(l))return true;
  }
  return false;
}
function readServices(){
  var initd=getNode('/etc/init.d');
  if(!initd||initd.type!=='dir')return null;
  var out=[];
  for(var name in initd.children){
    var f=initd.children[name];
    if(f.type!=='file')continue;
    var execM=f.content.match(/^ExecStart=(.+)$/m);
    var critM=f.content.match(/^Critical=(\w+)$/m);
    var descM=f.content.match(/^Description=(.+)$/m);
    out.push({
      name:name,
      exec:execM?execM[1].trim():null,
      critical:critM&&critM[1]==='yes',
      description:descM?descM[1].trim():name
    });
  }
  return out;
}

/* ══════════ Registry ══════════ */
var CMDS={};
var CATS=[['core','Shell'],['files','Files'],['text','Text'],['hash','Hash'],['archive','Archive'],['system','System'],['net','Network'],['dev','Development'],['fun','Fun'],['math','Math']];
var BUILTINS=new Set(['cd','exit','logout','alias','unalias','export','unset','set','source','history','help','man','info','whatis','clear','echo','printf','time','which','type','pwd','whoami','id','hostname','uname','install','reboot','shell','dmesg','true']);
var RECOVERY_ALLOW=new Set(['help','clear','install','reboot','shell','exit','ls','cat','mount','dmesg','pwd','echo','which','uname','true']);

function def(name,cat,desc,usage,fn){
  CMDS[name]={name:name,cat:cat,desc:desc,usage:usage||name,fn:fn};
}

function permString(n){
  var m=n.mode||(n.type==='dir'?'755':'644');
  var s=n.type==='dir'?'d':'-';
  var bits=[[4,'r'],[2,'w'],[1,'x']];
  for(var g=0;g<3;g++){
    var d=parseInt(m[g],10)||0;
    for(var b=0;b<bits.length;b++)s+=(d&bits[b][0])?bits[b][1]:'-';
  }
  return s;
}
function fmtDate(ts){
  var d=new Date(ts);
  var mon=d.toLocaleString('en-GB',{month:'short'});
  return mon+' '+String(d.getDate()).padStart(2,' ')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function sizeOf(n){
  if(n.type==='dir')return 4096;
  if(n.binary){try{return atob(n.content).length;}catch(e){return n.content.length;}}
  return Math.max(1,new TextEncoder().encode(n.content).length);
}
function humanSize(b){
  if(b<1024)return b+'B';
  if(b<1048576)return (b/1024).toFixed(1)+'K';
  if(b<1073741824)return (b/1048576).toFixed(1)+'M';
  return (b/1073741824).toFixed(1)+'G';
}
function colorName(name,n){
  if(n.type==='dir')return '\x1b[1;34m'+name+'\x1b[0m';
  var l=name.toLowerCase();
  if(l.charAt(0)==='.')return '\x1b[90m'+name+'\x1b[0m';
  if(l.endsWith('.md')||l.endsWith('.txt'))return '\x1b[0;37m'+name+'\x1b[0m';
  if(l.endsWith('.js')||l.endsWith('.py')||l.endsWith('.sh'))return '\x1b[0;33m'+name+'\x1b[0m';
  if(l.endsWith('.gz')||l.endsWith('.tar'))return '\x1b[0;31m'+name+'\x1b[0m';
  if(n.mode&&n.mode.charAt(2)==='5')return '\x1b[0;32m'+name+'\x1b[0m';
  return name;
}
function readStdinOrFiles(args,ctx){
  var files=args.filter(function(a){return a.charAt(0)!=='-';});
  if(!files.length)return ctx.stdin||'';
  var out='';
  for(var i=0;i<files.length;i++){
    var n=getNode(resolvePath(ctx.cwd,files[i]));
    if(!n||n.type==='dir'||n.binary)continue;
    out+=n.content;
    if(!out.endsWith('\n'))out+='\n';
  }
  return out;
}
function expandEnv(s){
  return String(s).replace(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)/g,function(m,a,b){
    var k=a||b;
    return state.env[k]!==undefined?state.env[k]:'';
  });
}

/* ══════════ State ══════════ */
var state={
  cwd:HOME,
  user:'user',
  host:'localhost',
  env:{
    USER:'user',HOME:HOME,SHELL:'/bin/rsh',PATH:'/usr/local/bin:/usr/bin:/bin:/sbin',
    TERM:'rendered-tty',LANG:'en_GB.UTF-8',EDITOR:'nano',
    HOSTNAME:'localhost',LOGNAME:'user',PWD:HOME,OLDPWD:HOME
  },
  aliases:{ll:'ls -l',la:'ls -la',l:'ls -la','..':'cd ..'},
  history:[],
  histIndex:-1,
  mode:'boot',
  bootLog:[],
  inputMode:null,
  running:true
};

function saveShellState(){
  try{localStorage.setItem(K_STATE,JSON.stringify({cwd:state.cwd,aliases:state.aliases,history:state.history.slice(-200)}));}catch(e){}
}
function loadShellState(){
  try{
    var raw=localStorage.getItem(K_STATE);
    if(!raw)return;
    var s=JSON.parse(raw);
    if(s&&typeof s==='object'){
      if(typeof s.cwd==='string'&&getNode(s.cwd))state.cwd=s.cwd;
      if(s.aliases&&typeof s.aliases==='object')state.aliases=s.aliases;
      if(Array.isArray(s.history))state.history=s.history;
    }
  }catch(e){}
}

/* ══════════ Boot ══════════ */
function logBoot(line){
  state.bootLog.push('['+(performance.now()/1000).toFixed(6)+'] '+line);
}
function writeDmesg(){
  var dmesg=getNode('/var/log/dmesg');
  if(dmesg&&dmesg.type==='file')dmesg.content=state.bootLog.join('\n')+'\n';
}

async function kernelPanic(reason){
  state.mode='panic';
  await sleep(300);
  clearScreen();
  print('');
  print('\x1b[1;31mKernel panic - not syncing:\x1b[0m');
  print('');
  print('  '+reason);
  print('');
  print('\x1b[90mCPU: 0 PID: 1 Comm: rinit Not tainted 6.9.2-rendered #1\x1b[0m');
  print('\x1b[90mCall Trace:\x1b[0m');
  print('\x1b[90m  panic+0x123/0x4f2\x1b[0m');
  print('\x1b[90m  rinit+0x88/0x320\x1b[0m');
  print('');
  print('\x1b[90m---[ end Kernel panic - not syncing: '+reason+' ]---\x1b[0m');
  print('');
  await sleep(1500);
  print('Entering recovery shell in 3...');
  await sleep(1000);
  print('2...');
  await sleep(1000);
  print('1...');
  await sleep(1000);
  await enterRecovery(reason);
}

async function enterRecovery(reason){
  state.mode='recovery';
  clearScreen();
  print('');
  print('\x1b[1;33mRenderedOS recovery shell\x1b[0m');
  print('');
  print('\x1b[90mThe system failed to boot: '+reason+'\x1b[0m');
  print('');
  print('Available commands:');
  print('  \x1b[1mhelp\x1b[0m       — list commands available here');
  print('  \x1b[1minstall\x1b[0m    — reinstall the base RenderedOS system');
  print('  \x1b[1mreboot\x1b[0m     — retry boot');
  print('  \x1b[1mls\x1b[0m, \x1b[1mcat\x1b[0m   — inspect the filesystem');
  print('  \x1b[1mdmesg\x1b[0m      — show the boot log');
  print('');
  refreshPrompt();
  inputLine.style.display='flex';
  inputEl.focus();
}

async function bootSystem(){
  state.mode='boot';
  async function show(line,delay){
    logBoot(line.replace(/\x1b\[[0-9;]*m/g,''));
    print(line);
    await sleep(delay||60);
  }

  await show('\x1b[90mRenderedOS BIOS v2.5.0 — POST\x1b[0m',80);
  await show('\x1b[90mCPU : Rendered Virtual Core @ 3.60GHz (4 cores)\x1b[0m',50);
  await show('\x1b[90mMEM : 16384 MB OK\x1b[0m',50);
  await show('',20);

  var vmlinuz=getNode('/boot/vmlinuz-rendered');
  if(!vmlinuz||vmlinuz.type!=='file'){
    await show('\x1b[37mLoading \x1b[0m\x1b[31m/boot/vmlinuz-rendered\x1b[0m\x1b[37m ... \x1b[31mFAILED\x1b[0m',0);
    return kernelPanic('VFS: Unable to mount root fs — kernel image not found (/boot/vmlinuz-rendered)');
  }
  await show('\x1b[37mLoading \x1b[0m\x1b[36m/boot/vmlinuz-rendered\x1b[0m\x1b[37m ... ok\x1b[0m',100);

  var initrd=getNode('/boot/initrd.img-rendered');
  if(!initrd||initrd.type!=='file'){
    await show('\x1b[37mLoading \x1b[0m\x1b[31m/boot/initrd.img-rendered\x1b[0m\x1b[37m ... \x1b[31mFAILED\x1b[0m',0);
    return kernelPanic('VFS: initrd missing — cannot mount root');
  }
  await show('\x1b[37mLoading \x1b[0m\x1b[36m/boot/initrd.img-rendered\x1b[0m\x1b[37m ... ok\x1b[0m',120);
  await show('',60);

  var fstab=readFstab();
  if(!fstab){
    return kernelPanic('VFS: no /etc/fstab — cannot mount root filesystem');
  }
  if(!fstab.length){
    return kernelPanic('VFS: /etc/fstab is empty — no filesystems to mount');
  }
  for(var i=0;i<fstab.length;i++){
    var m=fstab[i];
    await show('\x1b[90m[    0.'+Math.floor(Math.random()*900+100)+'] mounted '+m.device+' on '+m.mount+' type '+m.type+'\x1b[0m',50);
  }
  var rootMounted=false;
  for(var j=0;j<fstab.length;j++)if(fstab[j].mount==='/')rootMounted=true;
  if(!rootMounted){
    return kernelPanic('VFS: no root filesystem in /etc/fstab');
  }

  var passwd=readPasswd();
  if(!passwd||!passwd.length){
    return kernelPanic('VFS: /etc/passwd is empty or missing — no users configured');
  }
  await show('\x1b[90m[    0.35] loaded user database ('+passwd.length+' entries)\x1b[0m',40);

  if(!getNode('/sbin/rinit')){
    return kernelPanic('init: /sbin/rinit not found');
  }
  await show('\x1b[90m[    0.42] init: starting /sbin/rinit as PID 1\x1b[0m',60);

  if(!getNode('/bin/rsh')){
    return kernelPanic('init: /bin/rsh not found — cannot spawn shell');
  }
  await show('\x1b[90m[    0.51] init: registered shell /bin/rsh\x1b[0m',50);

  var services=readServices();
  if(services===null){
    await show('\x1b[33m[    0.60] init: /etc/init.d not found — no services to start\x1b[0m',80);
  }else{
    await show('',40);
    for(var s=0;s<services.length;s++){
      var svc=services[s];
      if(!svc.exec){
        await show('\x1b[33m[  SKIP  ] '+svc.name+': no ExecStart defined\x1b[0m',50);
        continue;
      }
      var exe=getNode(svc.exec);
      if(!exe){
        await show('\x1b[31m[ FAILED ] '+svc.name+': '+svc.exec+' not found\x1b[0m',60);
        if(svc.critical){
          return kernelPanic("init: critical service '"+svc.name+"' failed");
        }
        continue;
      }
      await show('\x1b[32m[  OK  ]\x1b[0m Started '+svc.description,70);
    }
  }

  if(readFile('/etc/hosts'))await show('\x1b[90m[    0.71] net: /etc/hosts loaded\x1b[0m',30);
  if(readFile('/etc/resolv.conf'))await show('\x1b[90m[    0.75] net: /etc/resolv.conf loaded\x1b[0m',30);

  var hn=readHostname();
  if(hn){
    state.host=hn;
    state.env.HOSTNAME=hn;
    await show('\x1b[90m[    0.82] set hostname to \''+hn+'\'\x1b[0m',40);
  }else{
    await show('\x1b[33m[    0.82] /etc/hostname missing\x1b[0m',40);
    state.host='localhost';
  }

  await show('',100);
  await show('\x1b[1;32mRenderedOS 3.0 (Kernel) ready.\x1b[0m',300);
  await sleep(400);

  writeDmesg();
  saveFS();

  clearScreen();
  state.mode='running';

  var osrel=readOsRelease();
  print('\x1b[1;36m'+(osrel?osrel.PRETTY_NAME:'RenderedOS')+' \x1b[0m\x1b[90m—\x1b[0m \x1b[37m'+state.host+' tty1\x1b[0m');
  print('');
  print(readMOTD());
  print('');
  print('\x1b[90mLast login: '+new Date().toDateString()+' '+new Date().toTimeString().slice(0,5)+' on tty1\x1b[0m');
  print('');
  print('Type \x1b[1;33mhelp\x1b[0m for commands. Try \x1b[1;33mls /boot\x1b[0m, \x1b[1;33mcat /etc/fstab\x1b[0m, \x1b[1;33msha256sum /etc/passwd\x1b[0m.');
  print('');
  refreshPrompt();
  inputLine.style.display='flex';
  inputEl.focus();
}

/* ══════════ Core commands ══════════ */
function manPage(c){
  return [
    '\x1b[1;36m'+c.name.toUpperCase()+'(1)\x1b[0m'+' '.repeat(Math.max(1,30-c.name.length))+'\x1b[90mRenderedOS Manual\x1b[0m',
    '',
    '\x1b[1mNAME\x1b[0m',
    '       '+c.name+' — '+c.desc,
    '',
    '\x1b[1mSYNOPSIS\x1b[0m',
    '       '+c.usage,
    '',
    '\x1b[1mCATEGORY\x1b[0m',
    '       '+(CATS.find(function(x){return x[0]===c.cat;})||['','misc'])[1]
  ].join('\n');
}

def('help','core','show this help','help [command]',function(args){
  if(args[0]==='me')return "\x1b[1;36mI thought you'd never ask.\x1b[0m\n\nEverything is real. Read \x1b[33mcat /etc/fstab\x1b[0m, then \x1b[33mrm /boot/vmlinuz-rendered\x1b[0m, then \x1b[33mreboot\x1b[0m.";
  if(args[0]){var c=CMDS[args[0]];if(!c)return '\x1b[31mhelp: no such command: '+args[0]+'\x1b[0m';return manPage(c);}
  var out='\x1b[1;36mRenderedOS shell\x1b[0m \x1b[90m— available commands\x1b[0m\n';
  for(var ci=0;ci<CATS.length;ci++){
    var key=CATS[ci][0],label=CATS[ci][1];
    var names=Object.keys(CMDS).filter(function(n){return CMDS[n].cat===key;}).sort();
    if(!names.length)continue;
    out+='\n\x1b[1;33m'+label.toUpperCase()+'\x1b[0m\n';
    var line='  ';
    for(var ni=0;ni<names.length;ni++){
      var n=names[ni];
      var isB=BUILTINS.has(n);
      var hasBin=!!getNode('/bin/'+n);
      var marker=isB?'\x1b[36m•\x1b[0m':hasBin?'\x1b[32m•\x1b[0m':'\x1b[31m•\x1b[0m';
      if((line+n).length>72){out+=line+'\n';line='  ';}
      line+=marker+n+'  ';
    }
    if(line.trim())out+=line+'\n';
  }
  out+='\n\x1b[90m• builtin   • binary present   • binary missing\x1b[0m';
  return out;
});
def('man','core','display manual page','man <command>',function(args){
  if(!args[0])return '\x1b[33mWhat manual page do you want?\x1b[0m';
  var c=CMDS[args[0]];
  if(!c)return '\x1b[31mNo manual entry for '+args[0]+'\x1b[0m';
  return manPage(c);
});
def('clear','core','clear screen','clear',function(){clearScreen();return '';});
def('exit','core','exit shell','exit',function(){
  if(state.mode==='recovery'){print('\x1b[90mThe recovery shell cannot be exited.\x1b[0m');return '';}
  print('\x1b[90mlogout\x1b[0m');
  inputLine.style.display='none';
  state.running=false;
  return '';
});
def('logout','core','exit shell','logout',function(){return CMDS.exit.fn([],{});});
def('history','core','command history','history [-c]',function(args){
  if(args[0]==='-c'){state.history=[];saveShellState();return '';}
  return state.history.map(function(h,i){return String(i+1).padStart(5)+'  '+h;}).join('\n')||'';
});
def('alias','core','define aliases','alias [name=value]',function(args){
  if(!args.length)return Object.keys(state.aliases).map(function(k){return "alias "+k+"='"+state.aliases[k]+"'";}).join('\n');
  var out=[];
  for(var i=0;i<args.length;i++){
    var a=args[i];
    var idx=a.indexOf('=');
    if(idx<0){out.push("alias "+a+"='"+（state.aliases[a]||'')+"'");continue;}
    state.aliases[a.slice(0,idx)]=a.slice(idx+1).replace(/^['"]|['"]$/g,'');
  }
  saveShellState();
  return out.join('\n');
});
def('unalias','core','remove aliases','unalias <name>',function(args){for(var i=0;i<args.length;i++)delete state.aliases[args[i]];saveShellState();return '';});
def('echo','core','echo text','echo [-n] [args]',function(args){
  var nl=true;
  if(args[0]==='-n'){nl=false;args=args.slice(1);}
  return expandEnv(args.join(' '))+(nl?'':'');
});
def('printf','core','format print','printf <fmt> [args]',function(args){
  if(!args.length)return '';
  var fmt=args[0].replace(/\\n/g,'\n').replace(/\\t/g,'\t');
  var i=1;
  fmt=fmt.replace(/%s/g,function(){return args[i++]||'';});
  return expandEnv(fmt);
});
def('env','core','environment','env',function(){return Object.keys(state.env).map(function(k){return k+'='+state.env[k];}).join('\n');});
def('export','core','set env','export NAME=value',function(args){for(var i=0;i<args.length;i++){var a=args[i];var idx=a.indexOf('=');if(idx>0)state.env[a.slice(0,idx)]=a.slice(idx+1);}return '';});
def('unset','core','unset env','unset NAME',function(args){for(var i=0;i<args.length;i++)delete state.env[args[i]];return '';});
def('set','core','shell vars','set',function(){return Object.keys(state.env).map(function(k){return k+"='"+state.env[k]+"'";}).join('\n');});
def('source','core','execute from file','source <file>',async function(args,ctx){
  if(!args[0])return 'source: missing filename';
  var n=getNode(resolvePath(ctx.cwd,args[0]));
  if(!n||n.type!=='file')return 'source: '+args[0]+': No such file';
  var lines=n.content.split('\n');
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(!t||t.charAt(0)==='#')continue;
    await execLine(t);
  }
  return '';
});
def('which','core','locate command','which <cmd>',function(args){
  if(!args[0])return 'which: missing argument';
  return args.map(function(a){
    if(BUILTINS.has(a))return a+': shell built-in';
    var paths=['/bin/','/usr/bin/','/sbin/','/usr/sbin/'];
    for(var i=0;i<paths.length;i++)if(getNode(paths[i]+a))return paths[i]+a;
    return 'which: no '+a+' in ('+state.env.PATH+')';
  }).join('\n');
});
def('type','core','command type','type <cmd>',function(args){
  if(!args[0])return 'type: missing argument';
  return args.map(function(a){
    if(state.aliases[a])return a+" is aliased to `"+state.aliases[a]+"'";
    if(BUILTINS.has(a))return a+' is a shell builtin';
    var paths=['/bin/','/usr/bin/','/sbin/','/usr/sbin/'];
    for(var i=0;i<paths.length;i++)if(getNode(paths[i]+a))return a+' is '+paths[i]+a;
    return 'type: '+a+': not found';
  }).join('\n');
});
def('pwd','core','working directory','pwd',function(a,c){return c.cwd;});
def('cd','core','change directory','cd [dir]',function(args,ctx){
  var target=args[0]||state.env.HOME||HOME;
  var full=resolvePath(ctx.cwd,target);
  var n=getNode(full);
  if(!n)return 'cd: '+target+': No such file or directory';
  if(n.type!=='dir')return 'cd: '+target+': Not a directory';
  state.env.OLDPWD=state.cwd;
  state.cwd=full;
  state.env.PWD=full;
  saveShellState();
  return '';
});
def('whoami','core','current user','whoami',function(){return state.user;});
def('id','core','user info','id',function(){
  var users=readPasswd()||[];
  var u=null;
  for(var i=0;i<users.length;i++)if(users[i].name===state.user){u=users[i];break;}
  if(!u)return '\x1b[31mid: cannot find name for user ID\x1b[0m';
  return 'uid='+u.uid+'('+u.name+') gid='+u.gid+'('+u.name+') groups='+u.gid+'('+u.name+'),27(sudo)';
});
def('hostname','core','hostname','hostname',function(){return readHostname()||state.host;});
def('uname','core','system info','uname [-a]',function(args){
  var osrel=readOsRelease();
  var name=osrel?osrel.NAME:'RenderedOS';
  var host=readHostname()||state.host;
  if(args.indexOf('-a')>=0)return name+' '+host+' 6.9.2-rendered #1 SMP RenderedGen x86_64 GNU/Browser';
  if(args.indexOf('-r')>=0)return '6.9.2-rendered';
  if(args.indexOf('-n')>=0)return host;
  if(args.indexOf('-m')>=0)return 'x86_64';
  return name;
});
def('sleep','core','delay','sleep <sec>',async function(args){
  var n=parseFloat(args[0]||'1');
  if(isNaN(n))return 'sleep: invalid time interval';
  await sleep(clamp(n,0,30)*1000);
  return '';
});
def('seq','core','sequence','seq [a] [b] c',function(args){
  var nums=args.map(Number);
  var start=1,inc=1,end;
  if(nums.length===1)end=nums[0];
  else if(nums.length===2){start=nums[0];end=nums[1];}
  else if(nums.length>=3){start=nums[0];inc=nums[1];end=nums[2];}
  else return 'seq: missing operand';
  if(inc===0)return 'seq: invalid increment';
  var out=[];
  for(var i=start;inc>0?i<=end:i>=end;i+=inc){out.push(String(i));if(out.length>5000)break;}
  return out.join('\n');
});
def('yes','core','repeat string','yes [str]',function(args){
  var s=args.join(' ')||'y';
  var out=[];
  for(var i=0;i<200;i++)out.push(s);
  out.push('\x1b[90m[truncated]\x1b[0m');
  return out.join('\n');
});
def('date','core','date','date [+fmt]',function(args){
  var d=new Date();
  if(args[0]&&args[0].charAt(0)==='+'){
    return args[0].slice(1)
      .replace(/%Y/g,d.getFullYear())
      .replace(/%m/g,String(d.getMonth()+1).padStart(2,'0'))
      .replace(/%d/g,String(d.getDate()).padStart(2,'0'))
      .replace(/%H/g,String(d.getHours()).padStart(2,'0'))
      .replace(/%M/g,String(d.getMinutes()).padStart(2,'0'))
      .replace(/%S/g,String(d.getSeconds()).padStart(2,'0'));
  }
  return d.toString();
});
def('uptime','core','uptime','uptime',function(){
  var s=Math.floor(performance.now()/1000);
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60);

def('ls','files','list directory','ls [-lah] [path]',function(args,ctx){
  var all=false,long=false,human=false;
  var paths=[];
  for(var i=0;i<args.length;i++){
    var a=args[i];
    if(a.charAt(0)==='-'&&a.length>1){
      for(var j=1;j<a.length;j++){
        if(a[j]==='a')all=true;
        else if(a[j]==='l')long=true;
        else if(a[j]==='h')human=true;
      }
    }else paths.push(a);
  }
  if(!paths.length)paths.push('.');
  function render(path,label){
    var n=getNode(path);
    if(!n)return "ls: cannot access '"+label+"': No such file or directory";
    if(n.type==='file'){
      if(long)return permString(n)+' 1 '+pad(n.owner,6)+' '+pad(n.group,6)+' '+String(human?humanSize(sizeOf(n)):sizeOf(n)).padStart(6)+' '+fmtDate(n.mtime)+' '+colorName(label,n);
      return colorName(label,n);
    }
    var names=Object.keys(n.children).sort();
    if(!all)names=names.filter(function(x){return x.charAt(0)!=='.';});
    var out='';
    if(long){
      var total=0;
      for(var k=0;k<names.length;k++)total+=Math.ceil(sizeOf(n.children[names[k]])/1024);
      out+='total '+total+'\n';
      out+=names.map(function(x){
        var c=n.children[x];
        return permString(c)+' 1 '+pad(c.owner,6)+' '+pad(c.group,6)+' '+String(human?humanSize(sizeOf(c)):sizeOf(c)).padStart(6)+' '+fmtDate(c.mtime)+' '+colorName(x,c);
      }).join('\n');
    }else if(names.length){
      var line='';
      for(var q=0;q<names.length;q++){
        var col=colorName(names[q],n.children[names[q]]);
        var plain=names[q]+(n.children[names[q]].type==='dir'?'/':'');
        if(line.replace(/\x1b\[[0-9;]*m/g,'').length+plain.length+2>78){out+=line+'\n';line='';}
        line+=col+(n.children[names[q]].type==='dir'?'/':'')+'  ';
      }
      out+=line.replace(/\s+$/,'');
    }
    return out;
  }
  return paths.map(function(p){return render(resolvePath(ctx.cwd,p),p);}).join('\n\n');
});
def('cat','files','concatenate files','cat [-n] [file...]',function(args,ctx){

    if(args[i]==='-n')n=true;

  var out='';
  for(var f=0;f<files.length;f++){

    if(!node){out+='cat: '+files[f]+': No such file or directory\n';continue;}

    if(!out.endsWith('\n'))out+='\n';
  }
  if(n){
    var i2=1;
    out=out.replace(/\n$/,'').split('\n').map(function(l){return String(i2++).padStart(6)+'\t'+l;}).join('\n');

def('wc','files','word count','wc [-lwc] [file]',function(args,ctx){
  var l=false,w=false,c=false;

  for(var i=0;i<args.length;i++){
    var a=args[i];
    if(a==='-l')l=true;
    else if(a==='-w')w=true;
    else if(a==='-c')c=true;
    else if(a.charAt(0)==='-'){
      for(var j=1;j<a.length;j++){
        if(a[j]==='l')l=true;
        else if(a[j]==='w')w=true;
        else if(a[j]==='c')c=true;
      }
    }else files.push(a);
  }
  if(!l&&!w&&!c)l=w=c=true;
  var targets=files.length?files:[null];
  var out=[];
  for(var t=0;t<targets.length;t++){
    var src=targets[t]===null?(ctx.stdin||''):readStdinOrFiles([targets[t]],ctx);
    var lines=src===''?0:src.replace(/\n$/,'').split('\n').length;
    var words=src.split(/\s+/).filter(Boolean).length;
    var bytes=new TextEncoder().encode(src).length;
    var parts=[];
    if(l)parts.push(String(lines).padStart(7));
    if(w)parts.push(String(words).padStart(7));
    if(c)parts.push(String(bytes).padStart(7));

def('rm','files','remove files','rm [-rf] [--no-preserve-root] <path...>',function(args,ctx){

    if(a.charAt(0)==='-'&&a.length>1){
      for(var j=1;j<a.length;j++){
        if(a[j]==='r'||a[j]==='R')rec=true;

  var out='';

      if(!rec||!force){out+="rm: cannot remove '/': Is a directory\n";continue;}
      if(!noPreserve){out+="\x1b[31mrm: it is dangerous to operate recursively on '/'\x1b[0m\nrm: use --no-preserve-root to override\n";continue;}

    if(gp.parent&&gp.parent.ro){out+='rm: cannot remove '+paths[p]+': Read-only\n';continue;}
    if(gp.parent)delete gp.parent.children[gp.name];
  }
  saveFS();
  return out.replace(/\n$/,'');
});

def('tree','files','directory tree','tree [-a] [path]',function(args,ctx){
  var all=false;
  var target='.';
  for(var i=0;i<args.length;i++){
    if(args[i]==='-a')all=true;
    else if(args[i].charAt(0)!=='-')target=args[i];
  }
  var root=resolvePath(ctx.cwd,target);
  var n=getNode(root);
  if(!n)return 'tree: No such file or directory';
  var dirs=0,files=0;
  function walk(nd,prefix){
    var names=Object.keys(nd.children).sort();
    if(!all)names=names.filter(function(x){return x.charAt(0)!=='.';});
    var out='';
    for(var i=0;i<names.length;i++){
      var last=i===names.length-1;
      var child=nd.children[names[i]];
      out+=prefix+(last?'└── ':'├── ')+colorName(names[i],child)+'\n';
      if(child.type==='dir'){dirs++;out+=walk(child,prefix+(last?'    ':'│   '));}
      else files++;
    }
    return out;
  }
  return '\x1b[1;34m'+target+'\x1b[0m\n'+walk(n,'')+'\n'+dirs+' directories, '+files+' files';
});
def('find','files','find files','find [path] [-name pat] [-type f|d]',function(args,ctx){
  var start='.',name=null,type=null;
  for(var i=0;i<args.length;i++){
    if(args[i]==='-name')name=args[++i];
    else if(args[i]==='-type')type=args[++i];
    else if(args[i].charAt(0)!=='-')start=args[i];
  }
  var root=resolvePath(ctx.cwd,start);
  var n=getNode(root);
  if(!n)return "find: '"+start+"': No such file or directory";
  var results=[];
  var rx=name?new RegExp('^'+name.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'):null;
  function walk(nd,path){
    if((!type||(type==='d'&&nd.type==='dir')||(type==='f'&&nd.type==='file'))&&(!rx||rx.test(path.split('/').pop()||'/')))results.push(path);
    if(nd.type==='dir'){
      for(var k in nd.children)walk(nd.children[k],path==='/'?'/'+k:path+'/'+k);
    }
  }
  walk(n,root);
  return results.join('\n')||'';
});

def('grep','text','search text','grep [-inv] <pat> [file...]',function(args,ctx){

      var isText=true;
      for(var j=0;j<Math.min(e.content.length,512);j++){
        var b=e.content[j];
        if(b<9||(b>13&&b<32)){isText=false;break;}
      }
      if(isText)writeFile(dest,new TextDecoder().decode(e.content));
      else{
        var b64='';
        for(var j=0;j<e.content.length;j+=0x8000)b64+=String.fromCharCode.apply(null,e.content.subarray(j,j+0x8000));
        b64=btoa(b64);
        var gp=getParent(dest);
        if(gp.parent)gp.parent.children[gp.name]=F(b64,{binary:true,mtime:Date.now()});
      }
    }
    saveFS();
    return entries.map(function(e){return e.name;}).join('\n');
  }
  return '';
});

async function realFetch(url,opts){
  opts=opts||{};
  var timeout=opts.timeout||15000;
  var controller=new AbortController();
  var timer=setTimeout(function(){controller.abort();},timeout);
  var t0=performance.now();
  try{
    var res=await fetch(url,{signal:controller.signal,method:opts.method||'GET',headers:opts.headers||{},redirect:'follow',mode:'cors'});
    clearTimeout(timer);
    var dt=performance.now()-t0;
    var headers={};
    res.headers.forEach(function(v,k){headers[k]=v;});
    var text=await res.text();
    return {ok:true,status:res.status,statusText:res.statusText,headers:headers,text:text,time:dt,url:res.url};
  }catch(e){
    clearTimeout(timer);
    var dt=performance.now()-t0;
    var msg=e&&e.message?e.message:String(e);
    if(e.name==='AbortError')msg='Operation timed out after '+timeout+'ms';
    return {ok:false,error:msg,time:dt,cors:/cors|failed to fetch/i.test(msg)};
  }
}
async function fetchWithFallback(url,opts){
  var r=await realFetch(url,opts);
  if(r.ok)return r;
  if(!r.cors)return r;
  try{
    var prox='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    var r2=await realFetch(prox,opts);
    if(r2.ok){r2.proxied=true;r2.proxyName='api.allorigins.win';return r2;}
  }catch(e){}
  try{
    var prox='https://r.jina.ai/'+url;
    var r3=await realFetch(prox,opts);
    if(r3.ok){r3.proxied=true;r3.proxyName='r.jina.ai';return r3;}
  }catch(e){}
  return r;
}

var nanoOpen=false;
function openNano(filename,initialContent){
  nanoOpen=true;
  var overlay=document.getElementById('nano');
  var title=document.getElementById('nano-title');
  var modEl=document.getElementById('nano-modified');
  var gutter=document.getElementById('nano-gutter');
  var textEl=document.getElementById('nano-text');
  var statusEl=document.getElementById('nano-status');
  var lines=initialContent.replace(/\n$/,'').split('\n');
  if(lines.length===1&&lines[0]==='')lines=[''];
  var row=0,col=0,dirty=false,scroll=0;
  title.textContent=filename||'[New Buffer]';
  function render(){
    var h=Math.max(10,Math.floor((window.innerHeight-140)/21));
    if(row<scroll)scroll=row;
    if(row>=scroll+h)scroll=row-h+1;
    var vis=lines.slice(scroll,scroll+h);
    gutter.innerHTML=vis.map(function(_,i){return String(scroll+i+1).padStart(4);}).join('\n');
    textEl.innerHTML=vis.map(function(l,i){
      var r=scroll+i;
      if(r!==row)return escHtml(l);
      return escHtml(l.slice(0,col))+'<span class="cursor">'+escHtml(l.charAt(col)||' ')+'</span>'+escHtml(l.slice(col+1));
    }).join('\n');
    statusEl.textContent='  '+filename+'  ·  Ln '+(row+1)+', Col '+(col+1)+'  ·  '+lines.length+' lines'+(dirty?'  ·  [modified]':'');
    modEl.textContent=dirty?'modified':'';
  }
  function save(){
    var content=lines.join('\n')+(lines.length?'\n':'');
    if(writeFile(resolvePath(state.cwd,filename),content)){dirty=false;saveFS();render();}
  }
  function close(){overlay.classList.remove('visible');nanoOpen=false;document.removeEventListener('keydown',onKey);inputEl.focus();}
  function onKey(e){
    if(!nanoOpen)return;
    var ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='s'){e.preventDefault();save();return;}
    if(ctrl&&e.key==='x'){e.preventDefault();if(dirty)save();close();return;}
    if(e.key==='Enter'){e.preventDefault();var a=lines[row].slice(0,col),b=lines[row].slice(col);lines[row]=a;lines.splice(row+1,0,b);row++;col=0;dirty=true;render();return;}
    if(e.key==='Backspace'){e.preventDefault();if(col>0){lines[row]=lines[row].slice(0,col-1)+lines[row].slice(col);col--;dirty=true;}else if(row>0){col=lines[row-1].length;lines[row-1]+=lines[row];lines.splice(row,1);row--;dirty=true;}render();return;}
    if(e.key==='ArrowLeft'){e.preventDefault();if(col>0)col--;else if(row>0){row--;col=lines[row].length;}render();return;}
    if(e.key==='ArrowRight'){e.preventDefault();if(col<lines[row].length)col++;else if(row<lines.length-1){row++;col=0;}render();return;}
    if(e.key==='ArrowUp'){e.preventDefault();if(row>0){row--;col=Math.min(col,lines[row].length);}render();return;}
    if(e.key==='ArrowDown'){e.preventDefault();if(row<lines.length-1){row++;col=Math.min(col,lines[row].length);}render();return;}
    if(e.key==='Tab'){e.preventDefault();lines[row]=lines[row].slice(0,col)+'  '+lines[row].slice(col);col+=2;dirty=true;render();return;}
    if(e.key==='Escape'){e.preventDefault();close();return;}
    if(e.key.length===1&&!ctrl){e.preventDefault();lines[row]=lines[row].slice(0,col)+e.key+lines[row].slice(col);col++;dirty=true;render();return;}
  }
  overlay.classList.add('visible');
  document.addEventListener('keydown',onKey);
  render();
  inputEl.blur();
}

/* ══════════ Shell ══════════ */
function tokenize(str){
  var tokens=[];
  var cur='',quote=null,i=0;
  while(i<str.length){
    var c=str.charAt(i);
    if(quote){
      if(c===quote){quote=null;i++;continue;}
      if(c==='\\'&&quote==='"'&&i+1<str.length){cur+=str.charAt(i+1);i+=2;continue;}
      cur+=c;i++;continue;
    }
    if(c==='"'||c==="'"){quote=c;i++;continue;}
    if(c==='\\'&&i+1<str.length){cur+=str.charAt(i+1);i+=2;continue;}
    if(c===' '||c==='\t'){if(cur!==''){tokens.push(cur);cur='';}i++;continue;}
    if(c==='|'||c==='>'||c==='&'||c===';'){
      if(cur!==''){tokens.push(cur);cur='';}
      if(c==='>'&&str.charAt(i+1)==='>'){tokens.push('>>');i+=2;continue;}
      if(c==='&'&&str.charAt(i+1)==='&'){tokens.push('&&');i+=2;continue;}
      if(c==='|'&&str.charAt(i+1)==='|'){tokens.push('||');i+=2;continue;}
      tokens.push(c);i++;continue;
    }
    cur+=c;i++;
  }
  if(cur!=='')tokens.push(cur);
  return tokens;
}
function splitRedirect(tokens){
  var redirect=null;
  var out=[];
  for(var i=0;i<tokens.length;i++){
    if(tokens[i]==='>'||tokens[i]==='>>'){redirect={mode:tokens[i],file:tokens[i+1]};i++;}
    else out.push(tokens[i]);
  }
  return {tokens:out,redirect:redirect};
}
function applyAlias(tokens){
  if(!tokens.length)return tokens;
  var a=state.aliases[tokens[0]];
  if(!a)return tokens;
  return tokenize(a).concat(tokens.slice(1));
}

async function runStage(tokens,stdin,opts){
  opts=opts||{};
  tokens=applyAlias(tokens);
  if(!tokens.length)return {stdout:'',code:0};
  var name=tokens[0];
  var args=tokens.slice(1);

  if(state.mode==='recovery'&&!RECOVERY_ALLOW.has(name)){
    return {stdout:'rsh: '+name+': not available in recovery mode',code:127};
  }

  if(BUILTINS.has(name)){
    var c=CMDS[name];
    if(!c)return {stdout:'rsh: '+name+': builtin not implemented',code:127};
    if(args[0]==='--help')return {stdout:manPage(c),code:0};
    var ctx={cwd:state.cwd,stdin:stdin||'',state:state,print:print,clear:clearScreen,sleep:sleep,live:makeLive,sudo:!!opts.sudo};
    try{
      var res=c.fn(args,ctx);
      if(res&&typeof res.then==='function')res=await res;
      var out=res==null?'':String(res);
      if(out&&!out.endsWith('\n'))out+='\n';
      return {stdout:out,code:0};
    }catch(err){
      return {stdout:'\x1b[31m'+name+': '+(err&&err.message?err.message:'error')+'\x1b[0m',code:1};
    }
  }

  var bin=findBinary(name);
  if(!bin){
    return {stdout:'rsh: '+name+': command not found\n\x1b[90m(the binary /bin/'+name+' is missing — try install)\x1b[0m',code:127};
  }

  var c2=CMDS[name];
  if(!c2){
    return {stdout:'rsh: '+name+': binary exists but command is not implemented',code:127};
  }
  if(args[0]==='--help')return {stdout:manPage(c2),code:0};

  var ctx2={cwd:state.cwd,stdin:stdin||'',state:state,print:print,clear:clearScreen,sleep:sleep,live:makeLive,sudo:!!opts.sudo};
  try{
    var res2=c2.fn(args,ctx2);
    if(res2&&typeof res2.then==='function')res2=await res2;
    var out2=res2==null?'':String(res2);
    if(out2&&!out2.endsWith('\n'))out2+='\n';
    return {stdout:out2,code:0};
  }catch(err){
    return {stdout:'\x1b[31m'+name+': '+(err&&err.message?err.message:'error')+'\x1b[0m',code:1};
  }
}

async function execPipeline(stageTokens){
  var stages=[];
  var cur=[];
  for(var i=0;i<stageTokens.length;i++){
    if(stageTokens[i]==='|'){stages.push(cur);cur=[];}
    else cur.push(stageTokens[i]);
  }
  stages.push(cur);
  var stdin='',code=0;
  for(var s=0;s<stages.length;s++){
    var sr=splitRedirect(stages[s]);
    var tokens=sr.tokens,redirect=sr.redirect;
    var isLast=s===stages.length-1;
    if(!tokens.length){stdin='';continue;}
    var res=await runStage(tokens,stdin);
    code=res.code;
    if(redirect){
      var path=resolvePath(state.cwd,redirect.file);
      var ok=writeFile(path,res.stdout,redirect.mode==='>>');
      if(ok)saveFS();
      else print('rsh: '+redirect.file+': cannot write');
      stdin='';
    }else if(isLast){
      if(res.stdout)print(res.stdout);
      stdin='';
    }else{
      stdin=res.stdout;
    }
  }
  return code;
}

async function execLine(line){
  var tokens=tokenize(line);
  if(!tokens.length)return 0;
  var segments=[],ops=[];
  var cur=[];
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    if(t===';'||t==='&&'||t==='||'){segments.push(cur);ops.push(t);cur=[];}
    else cur.push(t);
  }
  segments.push(cur);
  var code=0;
  for(var j=0;j<segments.length;j++){
    if(j>0){
      var op=ops[j-1];
      if(op==='&&'&&code!==0)continue;
      if(op==='||'&&code===0)continue;
    }
    code=await execPipeline(segments[j]);
  }
  return code;
}

async function captureOutput(line,opts){
  opts=opts||{};
  var tokens=tokenize(line);
  var stages=[];
  var cur=[];
  for(var i=0;i<tokens.length;i++){
    if(tokens[i]==='|'){stages.push(cur);cur=[];}
    else cur.push(tokens[i]);
  }
  stages.push(cur);
  var stdin='',out='';
  for(var s=0;s<stages.length;s++){
    var sr=splitRedirect(stages[s]);
    if(!sr.tokens.length)continue;
    var res=await runStage(sr.tokens,stdin,opts);
    stdin=res.stdout;
    out=res.stdout;
  }
  return out.replace(/\n$/,'');
}

    for(var i=0;i<names.length;i++)uniq[names[i]]=1;
    names=Object.keys(uniq).sort();
    var hits=names.filter(function(n){return n.indexOf(frag)===0;});
    if(hits.length===1){inputEl.value=hits[0]+' '+value.slice(caret);inputEl.selectionStart=inputEl.selectionEnd=hits[0].length+1;}
    else if(hits.length>1){print(hits.join('   '));refreshPrompt();}
    return;
  }
  var frag2=parts[parts.length-1];
  var slash=frag2.lastIndexOf('/');
  var dirPart=slash>=0?frag2.slice(0,slash+1):'';
  var namePart=slash>=0?frag2.slice(slash+1):frag2;
  var dirPath=resolvePath(state.cwd,dirPart||'.');
  var dir=getNode(dirPath);
  if(!dir||dir.type!=='dir')return;
  var hits2=Object.keys(dir.children).filter(function(n){
    return n.indexOf(namePart)===0&&(namePart.charAt(0)!=='.'||n.charAt(0)==='.');
  }).sort();
  if(hits2.length===1){
    var suffix=dir.children[hits2[0]].type==='dir'?'/':' ';
    var newFrag=dirPart+hits2[0]+suffix;
    inputEl.value=value.slice(0,caret-frag2.length)+newFrag+value.slice(caret);
    inputEl.selectionStart=inputEl.selectionEnd=caret-frag2.length+newFrag.length;
  }else if(hits2.length>1){
    print(hits2.map(function(h){return dir.children[h].type==='dir'?h+'/':h;}).join('   '));
    refreshPrompt();
  }
}

var busy=false;
async function handleSubmit(){
  var line=inputEl.value;
  inputEl.value='';
  if(state.inputMode==='wipe-confirm'){
    print('> '+line);
    print('');
    var norm=line.trim().toLowerCase();
    if(norm==='you asked for it'||norm==='that'||norm==='hat'){await doReinstall();}
    else{
      print('\x1b[90mThat is not what you were asked to type.\x1b[0m');
      print('');
      print('\x1b[1;37mType that.\x1b[0m');
    }
    return;
  }
  if(state.inputMode==='wipe-pending')return;
  if(!state.running)return;
  print(promptText()+line);
  if(!line.trim()){refreshPrompt();return;}
  state.history.push(line);
  state.histIndex=state.history.length;
  if(state.mode==='running')saveShellState();
  busy=true;
  try{await execLine(line);}
  catch(e){print('\x1b[31mrsh: internal error: '+(e&&e.message)+'\x1b[0m');}
  busy=false;
  if(state.inputMode)return;
  if(!state.running)return;
  refreshPrompt();
  scrollBottom();
  inputEl.focus();
}
inputEl.addEventListener('keydown',async function(e){
  if(e.key==='Enter'){e.preventDefault();if(busy)return;await handleSubmit();return;}
  if(state.inputMode)return;
  if(!state.running)return;
  if(e.key==='ArrowUp'){e.preventDefault();if(!state.history.length)return;state.histIndex=Math.max(0,state.histIndex-1);inputEl.value=state.history[state.histIndex]||'';return;}
  if(e.key==='ArrowDown'){e.preventDefault();if(!state.history.length)return;state.histIndex=Math.min(state.history.length,state.histIndex+1);inputEl.value=state.history[state.histIndex]||'';return;}
  if(e.key==='Tab'){e.preventDefault();complete();return;}
  if(e.ctrlKey&&e.key==='l'){e.preventDefault();clearScreen();refreshPrompt();return;}
  if(e.ctrlKey&&e.key==='c'){e.preventDefault();print(promptText()+inputEl.value+'\x1b[31m^C\x1b[0m');inputEl.value='';refreshPrompt();return;}
  if(e.ctrlKey&&e.key==='u'){e.preventDefault();inputEl.value='';return;}
});
document.addEventListener('click',function(e){
  if(nanoOpen)return;
  if(state.inputMode)return;
  if(!state.running)return;
  if(window.getSelection&&String(window.getSelection()).length)return;
  if(e.target.tagName!=='INPUT')inputEl.focus();
});

/* ══════════ Wipe / Reinstall ══════════ */
async function triggerWipe(){
  state.inputMode='wipe-pending';
  inputLine.style.display='none';
  var victims=['/bin','/sbin','/lib','/lib64','/usr','/etc','/var','/opt','/srv','/root','/home','/boot','/mnt','/media','/tmp'];
  for(var i=0;i<victims.length;i++){
    print('\x1b[31mrm: removing '+victims[i]+'\x1b[0m');
    await sleep(65);
  }
  await sleep(250);
  print('\x1b[1;31mrm: removing /\x1b[0m');
  await sleep(700);
  print('');
  print('\x1b[33mrm: filesystem is gone.\x1b[0m');
  await sleep(1000);
  FS=Dir({}, {owner:'root',group:'root'});
  saveFS();
  clearScreen();
  await sleep(600);
  for(var i=0;i<5;i++)print('');
  print('');
  print('\x1b[1;37m                     You asked for it.\x1b[0m');
  print('');
  print('\x1b[1;37m                     Type that.\x1b[0m');
  print('');
  print('');
  print('');
  state.inputMode='wipe-confirm';
  promptEl.innerHTML='';
  inputLine.style.display='flex';
  inputEl.value='';
  inputEl.focus();
}
async function doReinstall(){
  state.inputMode=null;
  inputLine.style.display='none';
  clearScreen();
  await sleep(400);
  print('\x1b[1;33mRenderedOS reinstaller v3.0\x1b[0m');
  print('');
  await sleep(350);
  print('\x1b[90m  > fetching latest image ………………………\x1b[0m');
  await sleep(750);
  print('\x1b[90m  > verifying signature ……………………… ok\x1b[0m');
  await sleep(500);
  print('\x1b[90m  > wiping previous install ………………… ok\x1b[0m');
  clearStorage();
  await sleep(650);
  print('\x1b[90m  > unpacking ……………………………………………………\x1b[0m');
  FS=defaultFS();
  ensureBins();
  saveFS();
  await sleep(850);
  print('\x1b[90m  > configuring ………………………………………… ok\x1b[0m');
  await sleep(500);
  print('');
  print('\x1b[32m✓ reinstall complete.\x1b[0m');
  await sleep(700);
  print('\x1b[33mrebooting…\x1b[0m');
  await sleep(1400);
  location.reload();
}

/* ══════════ Start ══════════ */
async function main(){
  var restored=loadFS();
  if(!restored){
    FS=defaultFS();
    ensureBins();
    saveFS();
  }
  loadShellState();
  state.env.PWD=state.cwd;
  try{
    await bootSystem();
  }catch(e){
    clearScreen();
    print('\x1b[31mRenderedOS failed to boot.\x1b[0m');
    print('');
    print(String(e&&e.stack?e.stack:e));
    print('');
    print('Open the browser console for details.');
  }
}
main();
