<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<style>
  :root{--bg:#0a0b0e;--fg:#c8ccd4;--dim:#565d6b;--accent:#7aa2f7;--green:#9ece6a;--red:#f7768e;--yellow:#e0af68;--purple:#bb9af7;--cyan:#7dcfff;}

  body{background:var(--bg);color:var(--fg);font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(1200px 500px at 50% -20%,rgba(122,162,247,.06),transparent 70%)}
  #screen{position:fixed;inset:0;padding:18px 22px 40px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#20242c transparent;white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch}
  #screen::-webkit-scrollbar{width:8px}
  #screen::-webkit-scrollbar-track{background:transparent}
  #screen::-webkit-scrollbar-thumb{background:#20242c;border-radius:4px}

  #cmd::selection{background:rgba(122,162,247,.3)}
  @media (max-width:600px){body{font-size:12px}#screen{padding:12px 12px 40px}}
  #nano{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;font-family:inherit;font-size:14px}
  #nano.visible{display:flex}
  #nano .bar{background:#c8ccd4;color:#0a0b0e;padding:2px 8px;font-weight:600;display:flex;justify-content:space-between;white-space:pre;overflow:hidden}
  #nano .body{flex:1 1 auto;overflow:hidden;padding:8px 4px 8px 8px;display:flex}
  #nano .lines{flex:1 1 auto;overflow:hidden;display:flex}
  #nano .gutter{color:var(--dim);text-align:right;padding-right:10px;border-right:1px solid #1c1f26;margin-right:10px;white-space:pre;line-height:1.5}
  #nano .text{flex:1 1 auto;white-space:pre;overflow:hidden;line-height:1.5}
  #nano .cursor{display:inline-block;width:8px;background:var(--accent);color:var(--bg);animation:blink 1s steps(1) infinite}

  #nano .hint .k{background:#0a0b0e;color:#c8ccd4;padding:0 4px;font-weight:700}
</style>

"use strict";
/* ═══════════════════════════════════════════════════════════
   RenderedOS 3.0 "Kernel"
   The filesystem is the source of truth.
   ═══════════════════════════════════════════════════════════ */
const VERSION = '3.0.0';
const K_FS = 'renderedos.fs.v3';
const K_META = 'renderedos.meta.v3';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = (s,n) => String(s).padEnd(n);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

/* ── ANSI → HTML ── */
const FG={30:'#3b4048',31:'#f7768e',32:'#9ece6a',33:'#e0af68',34:'#7aa2f7',35:'#bb9af7',36:'#7dcfff',37:'#c8ccd4',90:'#565d6b',91:'#ff8fa3',92:'#b9f27c',93:'#f5c97b',94:'#9ab8ff',95:'#d0b0ff',96:'#9fe0ff',97:'#ffffff'};
const BG={40:'#3b4048',41:'#f7768e',42:'#9ece6a',43:'#e0af68',44:'#7aa2f7',45:'#bb9af7',46:'#7dcfff',47:'#c8ccd4',100:'#565d6b',101:'#ff8fa3',102:'#b9f27c',103:'#f5c97b',104:'#9ab8ff',105:'#d0b0ff',106:'#9fe0ff',107:'#ffffff'};
function sWrap(t,st){if(!t)return '';let c='';if(st.fg)c+='color:'+st.fg+';';if(st.bg)c+='background:'+st.bg+';';if(st.bold)c+='font-weight:600;';if(st.italic)c+='font-style:italic;';if(st.underline)c+='text-decoration:underline;';if(st.dim)c+='opacity:.55;';const b=escHtml(t);return c?'<span style="'+c+'">'+b+'</span>':b;}
function renderAnsi(str){
  str=String(str==null?'':str);
  const st={fg:null,bg:null,bold:false,dim:false,italic:false,underline:false};
  let html='',rest=str;const re=/\x1b\[([0-9;]*)m/;
  while(rest.length){
    const m=re.exec(rest);
    if(!m){html+=sWrap(rest,st);break;}
    if(m.index>0)html+=sWrap(rest.slice(0,m.index),st);
    let codes=m[1].split(';').map(x=>x===''?0:parseInt(x,10));
    for(const c of codes){
      if(c===0){st.fg=null;st.bg=null;st.bold=false;st.dim=false;st.italic=false;st.underline=false;}
      else if(c===1)st.bold=true;else if(c===2)st.dim=true;else if(c===3)st.italic=true;else if(c===4)st.underline=true;
      else if(c===22){st.bold=false;st.dim=false;}else if(c===23)st.italic=false;else if(c===24)st.underline=false;
      else if(c===39)st.fg=null;else if(c===49)st.bg=null;
      else if(FG[c])st.fg=FG[c];else if(BG[c])st.bg=BG[c];
    }
    rest=rest.slice(m.index+m[0].length);
  }
  return html;
}

/* ── DOM ── */
const screenEl=document.getElementById('screen'),outputEl=document.getElementById('output');
const inputEl=document.getElementById('cmd'),promptEl=document.getElementById('prompt'),inputLine=document.getElementById('inputline');
function scrollBottom(){screenEl.scrollTop=screenEl.scrollHeight;}
function print(text,cls){
  let s=String(text==null?'':text);if(s.endsWith('\n'))s=s.slice(0,-1);
  const parts=s.split('\n');const frag=document.createDocumentFragment();
  for(const p of parts){const d=document.createElement('div');d.className='line'+(cls?' '+cls:'');d.innerHTML=renderAnsi(p);frag.appendChild(d);}
  outputEl.appendChild(frag);scrollBottom();
}
function clearScreen(){outputEl.innerHTML='';screenEl.scrollTop=0;}
function makeLive(){const d=document.createElement('div');d.className='line';outputEl.appendChild(d);return{set(t){d.innerHTML=renderAnsi(t);scrollBottom();},el:d};}

/* ═══════════════════════════════════════════════════════════
   VFS
   ═══════════════════════════════════════════════════════════ */
const HOME='/home/user';
const NOW=Date.now(),DAY=86400000;
const F=(c,o)=>Object.assign({type:'file',content:c||'',mtime:NOW,mode:'644',owner:'root',group:'root'},o||{});
const Dir=(ch,o)=>Object.assign({type:'dir',children:ch||{},mtime:NOW,mode:'755',owner:'root',group:'root'},o||{});

      'issue': F('RenderedOS 3.0 \\n \\l\n'),
      'init.d': Dir({
        'rcS': F('#! /bin/sh\n# System initialization\nExecStart=/bin/true\nCritical=yes\nDescription=System initialization\n'),
        'rcompositor': F('#! /bin/sh\n# Rendered compositor\nExecStart=/sbin/rcompositor\nCritical=no\nDescription=Rendered Compositor\n'),
        'rsh': F('#! /bin/sh\n# Rendered shell service\nExecStart=/bin/rsh\nCritical=yes\nDescription=Rendered Shell\n'),
        'network': F('#! /bin/sh\n# Network stack\nExecStart=/bin/true\nCritical=no\nDescription=Network\n'),
        'cron': F('#! /bin/sh\n# Job scheduler\nExecStart=/bin/true\nCritical=no\nDescription=Periodic command scheduler\n'),
        'syslog': F('#! /bin/sh\n# System logger\nExecStart=/bin/true\nCritical=no\nDescription=System Logging Service\n')
      })
    }),
    bin: Dir({
      /* populated by ensureBins() */
    }),
    sbin: Dir({
      'rinit': F('#! /bin/rsh\n# PID 1 — never kill\n',{mode:'755'}),
      'rcompositor': F('#! /bin/rsh\n# Rendered compositor\n',{mode:'755'}),
      'shutdown': F('#! /bin/rsh\n',{mode:'755'})
    }),
    usr: Dir({
      bin: Dir({}),
      lib: Dir({}),
      share: Dir({doc:Dir({})}),
      local: Dir({bin:Dir({})})
    }),
    var: Dir({
      log: Dir({
        'syslog': F(''),
        'auth.log': F(''),
        'dmesg': F(''),
        'kern.log': F('')
      }),
      spool: Dir({cron:Dir({})}),
      run: Dir({}),

    }),
    home: Dir({
      user: Dir({

console.log('hello, ' + name);

        Documents: Dir({'letter.txt': F('Dear user,\n\nThank you for booting RenderedOS. It is now a real system.\n\nYours,\n  the management\n',{owner:'user',group:'user'})}, {owner:'user',group:'user'}),
        '.config': Dir({}, {owner:'user',group:'user'})
      }, {owner:'user',group:'user',mode:'755'})
    }),
    root: Dir({}, {owner:'root',group:'root',mode:'700'}),
    tmp: Dir({}, {mode:'1777'}),
    proc: Dir({
      'cpuinfo': F('processor : 0\nvendor_id : RenderedGen\nmodel name : Rendered Virtual Core\n'),
      'meminfo': F('MemTotal: 16384000 kB\nMemFree: 13842112 kB\n'),
      'version': F('RenderedOS version 6.9.2-rendered #1 SMP\n'),
      'uptime': F('0.00 0.00\n')
    }, {ro:true}),
    sys: Dir({}, {ro:true}),
    dev: Dir({
      'null': F('',{mode:'666'}),
      'zero': F('',{mode:'666'}),
      'random': F('',{mode:'666'}),
      'tty': F('',{mode:'666'})
    }, {ro:true}),
    mnt: Dir({}),
    media: Dir({}),
    opt: Dir({}),

    lib64: Dir({})
  }, {owner:'root',group:'root'});
}

/* ── Persistence ── */
let FS = null;
function ser(n){
  if(n.type==='file'){const o={t:'f',c:n.content,m:n.mtime,o:n.mode,u:n.owner,g:n.group};if(n.binary)o.b=true;return o;}
  const k={};
  for(const x of Object.keys(n.children)){
    const c=n.children[x];if(c.ro)continue;
    k[x]=ser(c);
  }
  return {t:'d',m:n.mtime,o:n.mode,u:n.owner,g:n.group,k,ro:n.ro};
}
function deser(d){
  if(!d||typeof d!=='object')return null;
  if(d.t==='f')return F(d.c||'',{mtime:d.m||NOW,mode:d.o||'644',owner:d.u||'root',group:d.g||'root',binary:!!d.b});
  if(d.t==='d'){
    const k={};
    for(const x of Object.keys(d.k||{}))k[x]=deser(d.k[x]);
    return Dir(k,{mtime:d.m||NOW,mode:d.o||'755',owner:d.u||'root',group:d.g||'root',ro:!!d.ro});
  }
  return null;
}
function mergeFS(base,saved){
  if(!saved||saved.type!=='dir'||base.type!=='dir')return base;
  for(const k of Object.keys(saved.children)){
    const s=saved.children[k],b=base.children[k];
    if(!b)base.children[k]=s;
    else if(b.ro)continue;
    else if(b.type==='dir'&&s.type==='dir')mergeFS(b,s);
    else base.children[k]=s;
  }
  return base;
}
function saveFS(){
  try{
    const j=JSON.stringify(ser(FS));
    localStorage.setItem(K_FS,j);
    localStorage.setItem(K_META,JSON.stringify({version:VERSION,savedAt:Date.now(),bytes:j.length}));
    return true;
  }catch(e){console.warn('saveFS',e);return false;}
}
function loadFS(){
  try{
    const meta=JSON.parse(localStorage.getItem(K_META)||'null');
    if(meta&&meta.version!==VERSION){clearStorage();return false;}
    const raw=localStorage.getItem(K_FS);
    if(!raw)return false;
    const r=deser(JSON.parse(raw));
    if(r){FS=mergeFS(defaultFS(),r);return true;}
    return false;
  }catch(e){console.warn('loadFS',e);return false;}
}
function clearStorage(){try{localStorage.removeItem(K_FS);localStorage.removeItem(K_META);localStorage.removeItem(K_STATE);}catch(e){}}

/* ── Paths ── */
function splitPath(p){return String(p).split('/').filter(Boolean);}
function resolvePath(cwd,p){
  if(p===undefined||p===null||p==='')return cwd;
  p=String(p);
  if(p==='~')p=HOME;
  else if(p.startsWith('~/'))p=HOME+p.slice(1);
  let parts=p.startsWith('/')?[]:splitPath(cwd);
  for(const s of splitPath(p)){if(s==='.')continue;if(s==='..'){parts.pop();continue;}parts.push(s);}
  return '/'+parts.join('/');
}
function getNode(path){
  const parts=splitPath(path);
  let n=FS;
  for(const p of parts){
    if(!n||n.type!=='dir'||!n.children[p])return null;
    n=n.children[p];
  }
  return n;
}
function getParent(path){
  const parts=splitPath(path);
  const name=parts.pop();
  return {parent:getNode('/'+parts.join('/')),name};
}
function ensureDir(path){
  const parts=splitPath(path);
  let n=FS;
  for(const p of parts){
    if(!n.children[p])n.children[p]=Dir({});
    n=n.children[p];
    if(n.type!=='dir')return null;
  }
  return n;
}
function writeFile(path,content,append){
  const {parent,name}=getParent(path);
  if(!parent||parent.type!=='dir'||parent.ro)return false;
  const ex=parent.children[name];
  if(ex&&ex.type==='dir')return false;
  if(ex&&append){ex.content+=content;ex.mtime=Date.now();}
  else parent.children[name]=F(content,{mtime:Date.now()});
  return true;
}

/* ═══════════════════════════════════════════════════════════
   SYSTEM CONFIG READERS — these are what make the FS real
   ═══════════════════════════════════════════════════════════ */
function readFile(path){
  const n=getNode(path);
  if(!n||n.type!=='file')return null;
  return n.content;
}
function readHostname(){
  const c=readFile('/etc/hostname');
  if(!c)return null;
  return c.trim().split('\n')[0]||null;
}
function readPasswd(){
  const c=readFile('/etc/passwd');
  if(!c)return null;
  return c.split('\n').filter(l=>l.trim()&&!l.startsWith('#')).map(line=>{
    const p=line.split(':');
    return {name:p[0],pass:p[1],uid:+p[2],gid:+p[3],gecos:p[4],home:p[5],shell:p[6]};
  });
}
function readFstab(){
  const c=readFile('/etc/fstab');
  if(!c)return null;
  return c.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#')).map(line=>{
    const p=line.split(/\s+/);
    return {device:p[0],mount:p[1],type:p[2],options:p[3]||'defaults',dump:p[4]||'0',pass:p[5]||'0'};
  });
}
function readOsRelease(){
  const c=readFile('/etc/os-release');
  if(!c)return null;
  const o={};
  for(const line of c.split('\n')){
    const m=line.match(/^([A-Z_]+)="?([^"]*)"?$/);
    if(m)o[m[1]]=m[2];
  }
  return o;
}
function readMOTD(){
  const c=readFile('/etc/motd');
  if(!c)return '';
  return c;
}
function readSudoers(){
  const c=readFile('/etc/sudoers');
  if(!c)return [];
  return c.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));
}
function userCanSudo(username){
  const lines=readSudoers();
  if(!lines.length)return false;
  for(const l of lines){
    if(new RegExp('^'+username+'\\s+ALL=').test(l))return true;
    if(l.startsWith('root ALL')&&username==='root')return true;
  }
  return false;
}
function readServices(){
  const initd=getNode('/etc/init.d');
  if(!initd||initd.type!=='dir')return null;
  const out=[];
  for(const name of Object.keys(initd.children)){
    const f=initd.children[name];
    if(f.type!=='file')continue;
    const execM=f.content.match(/^ExecStart=(.+)$/m);
    const critM=f.content.match(/^Critical=(\w+)$/m);
    const descM=f.content.match(/^Description=(.+)$/m);
    out.push({
      name,
      exec:execM?execM[1].trim():null,
      critical:critM&&critM[1]==='yes',
      description:descM?descM[1].trim():name
    });
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   COMMAND REGISTRY
   ═══════════════════════════════════════════════════════════ */
const CMDS = {};
const CATS = [['core','Shell'],['files','Files'],['text','Text'],['hash','Hash'],['archive','Archive'],['system','System'],['net','Network'],['dev','Development'],['fun','Fun'],['math','Math']];

/* Builtins are part of the shell itself and survive even if /bin is emptied. */
const BUILTINS = new Set([
  'cd','exit','logout','alias','unalias','export','unset','set','source','history',
  'help','man','info','whatis','apropos','clear','echo','printf','time','which','type',
  'pwd','whoami','id','hostname','uname','install','reboot','shell','dmesg','true','false',
  ':','read','test','['
]);

/* In recovery mode, only these are allowed. */
const RECOVERY_ALLOW = new Set([
  'help','clear','install','reboot','shell','exit','ls','cat','mount','dmesg','pwd','echo','which','uname','true',':'
]);

function def(name,cat,desc,usage,fn){
  CMDS[name]={name,cat,desc,usage:usage||name,fn};
}

function permString(n){
  const m=n.mode||(n.type==='dir'?'755':'644');
  let s=n.type==='dir'?'d':'-';
  const bits=[[4,'r'],[2,'w'],[1,'x']];
  for(let g=0;g<3;g++){
    const d=parseInt(m[g],10)||0;
    for(const[v,c]of bits)s+=(d&v)?c:'-';
  }
  return s;
}
function fmtDate(ts){
  const d=new Date(ts);
  const mon=d.toLocaleString('en-GB',{month:'short'});
  return `${mon} ${String(d.getDate()).padStart(2,' ')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function sizeOf(n){
  if(n.type==='dir')return 4096;
  if(n.binary){try{return atob(n.content).length;}catch(e){return n.content.length;}}
  return Math.max(1,new TextEncoder().encode(n.content).length);
}
function humanSize(b){
  if(b<1024)return b+'B';
  if(b<1048576)return (b/1024).toFixed(1)+'K';
  if(b<1073741824)return (b/1048576).toFixed(1)+'M';
  return (b/1073741824).toFixed(1)+'G';
}
function colorName(name,n){
  if(n.type==='dir')return '\x1b[1;34m'+name+'\x1b[0m';
  const l=name.toLowerCase();
  if(l.startsWith('.'))return '\x1b[90m'+name+'\x1b[0m';
  if(l.endsWith('.md')||l.endsWith('.txt'))return '\x1b[0;37m'+name+'\x1b[0m';
  if(l.endsWith('.js')||l.endsWith('.py')||l.endsWith('.sh'))return '\x1b[0;33m'+name+'\x1b[0m';
  if(l.endsWith('.gz')||l.endsWith('.tar'))return '\x1b[0;31m'+name+'\x1b[0m';
  if(n.mode&&n.mode[2]==='5')return '\x1b[0;32m'+name+'\x1b[0m';
  return name;
}
function readStdinOrFiles(args,ctx){
  const files=args.filter(a=>!a.startsWith('-'));
  if(!files.length)return ctx.stdin||'';
  let out='';
  for(const f of files){
    const n=getNode(resolvePath(ctx.cwd,f));
    if(!n||n.type==='dir'||n.binary)continue;
    out+=n.content;
    if(!out.endsWith('\n'))out+='\n';
  }
  return out;
}
function expandEnv(s){
  return String(s).replace(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)/g,(m,a,b)=>{
    const k=a||b;return state.env[k]!==undefined?state.env[k]:'';
  });
}

/* ── state ── */
const state = {
  cwd: HOME,
  user: 'user',
  host: 'localhost',
  env: {
    USER:'user',HOME,SHELL:'/bin/rsh',PATH:'/usr/local/bin:/usr/bin:/bin:/sbin',
    TERM:'rendered-tty',LANG:'en_GB.UTF-8',EDITOR:'nano',PS1:'\\u@\\h:\\w\\$ ',
    HOSTNAME:'localhost',LOGNAME:'user',PWD:HOME,OLDPWD:HOME
  },
  aliases: {ll:'ls -l', la:'ls -la', l:'ls -la', '..':'cd ..'},
  history: [],
  histIndex: -1,
  mode: 'boot', // boot | running | recovery | panic
  bootLog: [],
  inputMode: null,
  running: true
};

function saveShellState(){
  try{localStorage.setItem(K_STATE,JSON.stringify({cwd:state.cwd,aliases:state.aliases,history:state.history.slice(-200)}));}catch(e){}
}
function loadShellState(){
  try{
    const raw=localStorage.getItem(K_STATE);if(!raw)return;
    const s=JSON.parse(raw);
    if(s&&typeof s==='object'){
      if(typeof s.cwd==='string'&&getNode(s.cwd))state.cwd=s.cwd;
      if(s.aliases&&typeof s.aliases==='object')state.aliases=s.aliases;
      if(Array.isArray(s.history))state.history=s.history;
    }
  }catch(e){}
}

function logBoot(line){
  state.bootLog.push(`[${(performance.now()/1000).toFixed(6).padStart(12,' ')}] ${line}`);
}
function writeDmesg(){
  const dmesg=getNode('/var/log/dmesg');
  if(dmesg&&dmesg.type==='file'){
    dmesg.content=state.bootLog.join('\n')+'\n';
    /* don't save FS here — saveFS would persist a broken state */
  }
}

async function kernelPanic(reason){
  state.mode='panic';
  await sleep(300);
  clearScreen();
  print('');
  print('\x1b[1;31mKernel panic - not syncing:\x1b[0m');
  print('');
  print('  '+reason);
  print('');
  print('\x1b[90mCPU: 0 PID: 1 Comm: rinit Not tainted 6.9.2-rendered #1\x1b[0m');
  print('\x1b[90mHardware name: Rendered Virtual Machine / RenderedGen, BIOS 2.5.0\x1b[0m');
  print('\x1b[90mCall Trace:\x1b[0m');
  print('\x1b[90m  <TASK>\x1b[0m');
  print('\x1b[90m  panic+0x123/0x4f2\x1b[0m');
  print('\x1b[90m  rinit+0x88/0x320\x1b[0m');
  print('\x1b[90m  <TASK>\x1b[0m');
  print('');
  print('\x1b[90m---[ end Kernel panic - not syncing: '+reason+' ]---\x1b[0m');
  print('');
  await sleep(1500);
  print('Entering recovery shell in 3...');
  await sleep(1000);
  print('2...');
  await sleep(1000);
  print('1...');
  await sleep(1000);
  await enterRecovery(reason);
}

async function enterRecovery(reason){
  state.mode='recovery';
  clearScreen();
  print('');
  print('\x1b[1;33mRenderedOS recovery shell\x1b[0m');
  print('');
  print('\x1b[90mThe system failed to boot: '+reason+'\x1b[0m');
  print('');
  print('Available commands:');
  print('  \x1b[1mhelp\x1b[0m       — list commands available here');
  print('  \x1b[1minstall\x1b[0m    — reinstall the base RenderedOS system');
  print('  \x1b[1mreboot\x1b[0m     — retry boot');
  print('  \x1b[1mls\x1b[0m, \x1b[1mcat\x1b[0m   — inspect the filesystem');
  print('  \x1b[1mdmesg\x1b[0m      — show the boot log');
  print('');
  refreshPrompt();
  inputLine.style.display='flex';
  inputEl.focus();
}

async function bootSystem(){
  state.mode='boot';
  const show=async(line,delay)=>{
    logBoot(line.replace(/\x1b\[[0-9;]*m/g,''));
    print(line);
    await sleep(delay||60);
  };

  /* BIOS / POST */
  await show('\x1b[90mRenderedOS BIOS v2.5.0 — POST\x1b[0m',80);
  await show('\x1b[90mCPU : Rendered Virtual Core @ 3.60GHz (4 cores)\x1b[0m',50);
  await show('\x1b[90mMEM : 16384 MB OK\x1b[0m',50);
  await show('',20);

  /* Kernel image — MUST exist */
  const vmlinuz=getNode('/boot/vmlinuz-rendered');
  if(!vmlinuz||vmlinuz.type!=='file'){
    await show('\x1b[37mLoading \x1b[0m\x1b[31m/boot/vmlinuz-rendered\x1b[0m\x1b[37m ... \x1b[31mFAILED\x1b[0m',0);
    await show('',100);
    return kernelPanic('VFS: Unable to mount root fs — kernel image not found (/boot/vmlinuz-rendered)');
  }
  await show('\x1b[37mLoading \x1b[0m\x1b[36m/boot/vmlinuz-rendered\x1b[0m\x1b[37m ... ok\x1b[0m',100);

  /* Initrd — MUST exist */
  const initrd=getNode('/boot/initrd.img-rendered');
  if(!initrd||initrd.type!=='file'){
    await show('\x1b[37mLoading \x1b[0m\x1b[31m/boot/initrd.img-rendered\x1b[0m\x1b[37m ... \x1b[31mFAILED\x1b[0m',0);
    return kernelPanic('VFS: initrd missing — cannot mount root (/boot/initrd.img-rendered)');
  }
  await show('\x1b[37mLoading \x1b[0m\x1b[36m/boot/initrd.img-rendered\x1b[0m\x1b[37m ... ok\x1b[0m',120);
  await show('',60);

  /* /etc/fstab — MUST exist */
  const fstab=readFstab();
  if(!fstab){
    await show('\x1b[31mNo /etc/fstab — cannot determine root filesystem\x1b[0m',0);
    return kernelPanic('VFS: no /etc/fstab — cannot mount root filesystem');
  }
  if(!fstab.length){
    return kernelPanic('VFS: /etc/fstab is empty — no filesystems to mount');
  }
  for(const m of fstab){
    await show(`\x1b[90m[    0.${Math.floor(Math.random()*900+100)}] mounted ${m.device} on ${m.mount} type ${m.type} (${m.options})\x1b[0m`,50);
  }
  const rootMounted=fstab.some(m=>m.mount==='/');
  if(!rootMounted){
    return kernelPanic('VFS: no root filesystem in /etc/fstab — system cannot continue');
  }

  /* /etc/passwd — MUST exist */
  const passwd=readPasswd();
  if(!passwd||!passwd.length){
    return kernelPanic('VFS: /etc/passwd is empty or missing — no users configured');
  }
  await show(`\x1b[90m[    0.35] loaded user database (${passwd.length} entries)\x1b[0m`,40);

  /* /sbin/rinit — MUST exist */
  if(!getNode('/sbin/rinit')){
    return kernelPanic('init: /sbin/rinit not found — no init system');
  }
  await show('\x1b[90m[    0.42] init: starting /sbin/rinit as PID 1\x1b[0m',60);

  /* /bin/rsh — MUST exist */
  if(!getNode('/bin/rsh')){
    return kernelPanic('init: /bin/rsh not found — cannot spawn shell');
  }
  await show('\x1b[90m[    0.51] init: registered shell /bin/rsh\x1b[0m',50);

  /* Services */
  const services=readServices();
  if(services===null){
    await show('\x1b[33m[    0.60] init: /etc/init.d not found — no services to start\x1b[0m',80);
  }else{
    await show('',40);
    for(const svc of services){
      if(!svc.exec){
        await show(`\x1b[33m[  SKIP  ] ${svc.name}: no ExecStart defined\x1b[0m`,50);
        continue;
      }
      const exe=getNode(svc.exec);
      if(!exe){
        await show(`\x1b[31m[ FAILED ] ${svc.name}: ${svc.exec} not found\x1b[0m`,60);
        if(svc.critical){
          return kernelPanic(`init: critical service '${svc.name}' failed — ${svc.exec} is missing`);
        }
        continue;
      }
      await show(`\x1b[32m[  OK  ]\x1b[0m Started ${svc.description}`,70);
    }
  }

  /* Network — /etc/hosts */
  if(readFile('/etc/hosts')){
    await show('\x1b[90m[    0.71] net: /etc/hosts loaded\x1b[0m',30);
  }
  if(readFile('/etc/resolv.conf')){
    await show('\x1b[90m[    0.75] net: /etc/resolv.conf loaded\x1b[0m',30);
  }

  /* Hostname */
  const hn=readHostname();
  if(hn){
    state.host=hn;
    state.env.HOSTNAME=hn;
    await show(`\x1b[90m[    0.82] set hostname to '${hn}'\x1b[0m`,40);
  }else{
    await show('\x1b[33m[    0.82] /etc/hostname missing — using "localhost"\x1b[0m',40);
    state.host='localhost';
  }

  await show('',100);
  await show('\x1b[1;32mRenderedOS 3.0 (Kernel) ready.\x1b[0m',300);
  await sleep(400);

  /* write dmesg to file BEFORE clearing */
  writeDmesg();
  saveFS();

  clearScreen();
  state.mode='running';

  const osrel=readOsRelease();
  print(`\x1b[1;36m${osrel?osrel.PRETTY_NAME:'RenderedOS'} \x1b[0m\x1b[90m—\x1b[0m \x1b[37m${state.host} tty1\x1b[0m`);
  print('');
  print(readMOTD()||'');
  print('');
  print(`\x1b[90mLast login: ${new Date().toDateString()} ${new Date().toTimeString().slice(0,5)} on tty1\x1b[0m`);
  print('');
  print('Type \x1b[1;33mhelp\x1b[0m for commands. Try \x1b[1;33mls /boot\x1b[0m, \x1b[1;33mcat /etc/fstab\x1b[0m, \x1b[1;33msha256sum /etc/passwd\x1b[0m.');
  print('');
  refreshPrompt();
  inputLine.style.display='flex';
  inputEl.focus();
}

function manPage(c){
  return [
    `\x1b[1;36m${c.name.toUpperCase()}(1)\x1b[0m`+' '.repeat(Math.max(1,30-c.name.length))+'\x1b[90mRenderedOS Manual\x1b[0m',
    '',
    '\x1b[1mNAME\x1b[0m',
    '       '+c.name+' — '+c.desc,
    '',
    '\x1b[1mSYNOPSIS\x1b[0m',
    '       '+c.usage,
    '',
    '\x1b[1mCATEGORY\x1b[0m',
    '       '+(CATS.find(x=>x[0]===c.cat)||['','misc'])[1],
    '',
    '\x1b[1mSEE ALSO\x1b[0m',
    '       help(1), man(1)'
  ].join('\n');
}

def('help','core','show this help','help [command]',(args)=>{
  if(args[0]==='me')return "\x1b[1;36mI thought you'd never ask.\x1b[0m\n\nEverything is real. Read \x1b[33mcat /etc/fstab\x1b[0m, then \x1b[33mrm /boot/vmlinuz-rendered\x1b[0m, then \x1b[33mreboot\x1b[0m.";
  if(args[0]){const c=CMDS[args[0]];if(!c)return `\x1b[31mhelp: no such command: ${args[0]}\x1b[0m`;return manPage(c);}
  let out='\x1b[1;36mRenderedOS shell\x1b[0m \x1b[90m— available commands\x1b[0m\n';
  for(const[key,label]of CATS){
    const names=Object.values(CMDS).filter(c=>c.cat===key).map(c=>c.name).sort();
    if(!names.length)continue;
    out+='\n\x1b[1;33m'+label.toUpperCase()+'\x1b[0m\n  ';
    let line='  ';
    for(const n of names){
      const isBuiltin=BUILTINS.has(n);
      const hasBin=!!getNode('/bin/'+n);
      const marker=isBuiltin?'\x1b[36m•\x1b[0m':hasBin?'\x1b[32m•\x1b[0m':'\x1b[31m•\x1b[0m';
      if((line+n).length>72){out+=line+'\n';line='  ';}
      line+=marker+n+'  ';
    }
    if(line.trim())out+=line+'\n';
  }
  out+='\n\x1b[90m• shell builtin  • binary present  • binary missing (command disabled)\x1b[0m';
  return out;
});
def('man','core','display manual page','man <command>',(args)=>{
  if(!args[0])return '\x1b[33mWhat manual page do you want?\x1b[0m';
  const c=CMDS[args[0]];
  if(!c)return `\x1b[31mNo manual entry for ${args[0]}\x1b[0m`;
  return manPage(c);
});
def('info','core','read info documentation','info <command>',(args)=>{const c=CMDS[args[0]||''];return c?manPage(c):`info: no entry`;});
def('whatis','core','one-line manual descriptions','whatis <command>',(args)=>{const c=CMDS[args[0]||''];return c?`${c.name} (1) — ${c.desc}`:`${args[0]}: nothing appropriate.`;});
def('clear','core','clear the screen','clear',()=>{clearScreen();return '';});
def('exit','core','exit the shell','exit [code]',()=>{
  if(state.mode==='recovery'){
    print('\x1b[90mThe recovery shell cannot be exited. Use `install` or `reboot`.\x1b[0m');
    return '';
  }
  print('\x1b[90mlogout\x1b[0m');
  inputLine.style.display='none';
  state.running=false;
  return '';
});
def('logout','core','exit the shell','logout',()=>CMDS.exit.fn([],{}));
def('history','core','show command history','history [-c]',(args)=>{
  if(args[0]==='-c'){state.history=[];saveShellState();return '';}
  return state.history.map((h,i)=>String(i+1).padStart(5)+'  '+h).join('\n')||'';
});
def('alias','core','define or display aliases','alias [name=value]',(args)=>{
  if(!args.length)return Object.entries(state.aliases).map(([k,v])=>`alias ${k}='${v}'`).join('\n');
  const out=[];
  for(const a of args){
    const i=a.indexOf('=');
    if(i<0){out.push(`alias ${a}='${state.aliases[a]||''}'`);continue;}
    state.aliases[a.slice(0,i)]=a.slice(i+1).replace(/^['"]|['"]$/g,'');
  }
  saveShellState();
  return out.join('\n');
});
def('unalias','core','remove aliases','unalias <name>',(args)=>{for(const a of args)delete state.aliases[a];saveShellState();return '';});
def('echo','core','display a line of text','echo [-n] [args...]',(args)=>{
  let nl=true;
  if(args[0]==='-n'){nl=false;args=args.slice(1);}
  return expandEnv(args.join(' '))+(nl?'':'');
});
def('printf','core','format and print data','printf <fmt> [args...]',(args)=>{
  if(!args.length)return '';
  let fmt=args[0].replace(/\\n/g,'\n').replace(/\\t/g,'\t');
  let i=1;
  fmt=fmt.replace(/%s/g,()=>args[i++]||'');
  return expandEnv(fmt);
});
def('env','core','print environment','env',()=>Object.entries(state.env).map(([k,v])=>`${k}=${v}`).join('\n'));
def('export','core','set env var','export NAME=value',(args)=>{for(const a of args){const i=a.indexOf('=');if(i>0)state.env[a.slice(0,i)]=a.slice(i+1);}return '';});
def('unset','core','remove env var','unset NAME',(args)=>{for(const a of args)delete state.env[a];return '';});
def('set','core','show shell variables','set',()=>Object.entries(state.env).map(([k,v])=>`${k}='${v}'`).join('\n'));
def('source','core','execute commands from a file','source <file>',async(args,ctx)=>{
  if(!args[0])return 'source: missing filename';
  const n=getNode(resolvePath(ctx.cwd,args[0]));
  if(!n||n.type!=='file')return `source: ${args[0]}: No such file`;
  for(const line of n.content.split('\n')){
    const t=line.trim();
    if(!t||t.startsWith('#'))continue;
    await execLine(t);
  }
  return '';
});
def('which','core','locate a command','which <cmd>',(args)=>{
  if(!args[0])return 'which: missing argument';
  return args.map(a=>{
    if(BUILTINS.has(a))return `${a}: shell built-in`;
    for(const p of ['/bin/','/usr/bin/','/sbin/','/usr/sbin/']){
      if(getNode(p+a))return p+a;
    }
    return `which: no ${a} in (${state.env.PATH})`;
  }).join('\n');
});
def('type','core','identify command type','type <cmd>',(args)=>{
  if(!args[0])return 'type: missing argument';
  return args.map(a=>{
    if(state.aliases[a])return `${a} is aliased to \`${state.aliases[a]}'`;
    if(BUILTINS.has(a))return `${a} is a shell builtin`;
    for(const p of ['/bin/','/usr/bin/','/sbin/','/usr/sbin/']){
      if(getNode(p+a))return `${a} is ${p+a}`;
    }
    return `type: ${a}: not found`;
  }).join('\n');
});
def('pwd','core','print working directory','pwd',(a,c)=>c.cwd);
def('cd','core','change directory','cd [dir]',(args,ctx)=>{
  const target=args[0]||state.env.HOME||HOME;
  const full=resolvePath(ctx.cwd,target);
  const n=getNode(full);
  if(!n)return `cd: ${target}: No such file or directory`;
  if(n.type!=='dir')return `cd: ${target}: Not a directory`;
  state.env.OLDPWD=state.cwd;
  state.cwd=full;
  state.env.PWD=full;
  saveShellState();
  return '';
});
def('whoami','core','print current user','whoami',()=>state.user);
def('id','core','print user info','id',()=>{
  const users=readPasswd()||[];
  const u=users.find(x=>x.name===state.user);
  if(!u)return '\x1b[31mid: cannot find name for user ID\x1b[0m';
  return `uid=${u.uid}(${u.name}) gid=${u.gid}(${u.name}) groups=${u.gid}(${u.name}),27(sudo)`;
});
def('hostname','core','show hostname','hostname',()=>readHostname()||state.host);
def('uname','core','print system info','uname [-a]',(args)=>{
  const osrel=readOsRelease();
  const name=osrel?osrel.NAME:'RenderedOS';
  const rel='6.9.2-rendered';
  const host=readHostname()||state.host;
  if(args.includes('-a'))return `${name} ${host} ${rel} #1 SMP RenderedGen x86_64 GNU/Browser`;
  if(args.includes('-r'))return rel;
  if(args.includes('-n'))return host;
  if(args.includes('-m'))return 'x86_64';
  return name;
});
def('sleep','core','delay execution','sleep <sec>',async(args)=>{
  const n=parseFloat(args[0]||'1');
  if(isNaN(n))return 'sleep: invalid time interval';
  await sleep(clamp(n,0,30)*1000);
  return '';
});
def('seq','core','print a sequence','seq [a] [b] c',(args)=>{
  const nums=args.map(Number);
  let start=1,inc=1,end;
  if(nums.length===1)end=nums[0];
  else if(nums.length===2){start=nums[0];end=nums[1];}
  else if(nums.length>=3){start=nums[0];inc=nums[1];end=nums[2];}
  else return 'seq: missing operand';
  if(inc===0)return 'seq: invalid increment';
  const out=[];

def('ls','files','list directory contents','ls [-lah] [path]',(args,ctx)=>{
  let all=false,long=false,human=false;
  const paths=[];
  for(const a of args){
    if(a.startsWith('-')&&a.length>1){for(const c of a.slice(1)){if(c==='a')all=true;else if(c==='l')long=true;else if(c==='h')human=true;}}
    else paths.push(a);
  }
  if(!paths.length)paths.push('.');
  function render(path,label){
    const n=getNode(path);
    if(!n)return `ls: cannot access '${label}': No such file or directory`;
    if(n.type==='file')return long?`${permString(n)} 1 ${pad(n.owner,6)} ${pad(n.group,6)} ${String(human?humanSize(sizeOf(n)):sizeOf(n)).padStart(6)} ${fmtDate(n.mtime)} ${colorName(label,n)}`:colorName(label,n);
    let names=Object.keys(n.children).sort();
    if(!all)names=names.filter(x=>!x.startsWith('.'));
    let out='';
    if(long){
      out+=`total ${names.reduce((s,x)=>s+Math.ceil(sizeOf(n.children[x])/1024),0)}\n`;
      out+=names.map(x=>{
        const c=n.children[x];
        return `${permString(c)} 1 ${pad(c.owner,6)} ${pad(c.group,6)} ${String(human?humanSize(sizeOf(c)):sizeOf(c)).padStart(6)} ${fmtDate(c.mtime)} ${colorName(x,c)}`;
      }).join('\n');
    }else if(names.length){
      let line='';
      for(const x of names){
        const col=colorName(x,n.children[x]);
        const plain=x+(n.children[x].type==='dir'?'/':'');
        if(line.replace(/\x1b\[[0-9;]*m/g,'').length+plain.length+2>78){out+=line+'\n';line='';}
        line+=col+(n.children[x].type==='dir'?'/':'')+'  ';
      }
      out+=line.replace(/\s+$/,'');
    }
    return out;
  }
  return paths.map(p=>render(resolvePath(ctx.cwd,p),p)).join('\n\n');
});
def('cat','files','concatenate files','cat [-n] [file...]',(args,ctx)=>{
  let n=false;const files=[];
  for(const a of args){if(a==='-n')n=true;else files.push(a);}
  if(!files.length)return ctx.stdin||'';
  let out='';
  for(const f of files){
    const path=resolvePath(ctx.cwd,f);
    if(path==='/dev/null')continue;
    if(path==='/dev/zero')return '\x1b[90m(infinite zeros — you stop reading)\x1b[0m';
    if(path==='/dev/random')return '\x1b[90m'+Array.from({length:8},()=>Math.random().toString(36).slice(2,12)).join('\n')+'\x1b[0m';
    const node=getNode(path);
    if(!node){out+=`cat: ${f}: No such file or directory\n`;continue;}
    if(node.type==='dir'){out+=`cat: ${f}: Is a directory\n`;continue;}
    if(node.binary){out+=`cat: ${f}: binary file\n`;continue;}
    out+=node.content;
    if(!out.endsWith('\n'))out+='\n';
  }
  if(n){let i=1;out=out.replace(/\n$/,'').split('\n').map(l=>String(i++).padStart(6)+'\t'+l).join('\n');}
  return out;
});

def('wc','files','word/line/byte counts','wc [-lwc] [file]',(args,ctx)=>{
  let l=false,w=false,c=false;
  const files=[];
  for(const a of args){
    if(a==='-l')l=true;else if(a==='-w')w=true;else if(a==='-c')c=true;
    else if(a.startsWith('-')){for(const ch of a.slice(1)){if(ch==='l')l=true;else if(ch==='w')w=true;else if(ch==='c')c=true;}}
    else files.push(a);
  }
  if(!l&&!w&&!c)l=w=c=true;
  const targets=files.length?files:[null];
  const out=[];
  for(const f of targets){
    const src=f===null?(ctx.stdin||''):readStdinOrFiles([f],ctx);
    const lines=src===''?0:src.replace(/\n$/,'').split('\n').length;
    const words=src.split(/\s+/).filter(Boolean).length;
    const bytes=new TextEncoder().encode(src).length;
    const parts=[];
    if(l)parts.push(String(lines).padStart(7));
    if(w)parts.push(String(words).padStart(7));
    if(c)parts.push(String(bytes).padStart(7));
    out.push(parts.join('')+(f?' '+f:''));
  }
  return out.join('\n');
});
def('touch','files','create empty file','touch <file...>',(args,ctx)=>{

def('mkdir','files','make directories','mkdir [-p] <dir...>',(args,ctx)=>{

def('rmdir','files','remove empty dirs','rmdir <dir...>',(args,ctx)=>{

    if(!n)return `rmdir: failed to remove '${d}': No such file or directory`;
    if(n.type!=='dir')return `rmdir: '${d}': Not a directory`;
    if(Object.keys(n.children).length)return `rmdir: '${d}': Directory not empty`;
    const {parent,name}=getParent(full);

def('rm','files','remove files','rm [-rf] [--no-preserve-root] <path...>',(args,ctx)=>{
  let rec=false,force=false,noPreserve=false;
  const paths=[];
  for(const a of args){
    if(a==='--no-preserve-root'){noPreserve=true;continue;}
    if(a.startsWith('-')&&a.length>1){for(const c of a.slice(1)){if(c==='r'||c==='R')rec=true;else if(c==='f')force=true;}}
    else paths.push(a);
  }
  if(!paths.length)return force?'':'rm: missing operand';
  let out='';
  for(const p of paths){
    const full=resolvePath(ctx.cwd,p);
    if(full==='/'){
      if(!rec||!force){out+=`rm: cannot remove '/': Is a directory\n`;continue;}
      if(!noPreserve){out+="\x1b[31mrm: it is dangerous to operate recursively on '/'\x1b[0m\nrm: use --no-preserve-root to override\n";continue;}
      if(!ctx.sudo){out+="\x1b[31mrm: cannot remove '/': Permission denied\x1b[0m\n\x1b[90m(need root — try: sudo rm -rf / --no-preserve-root)\x1b[0m\n";continue;}
      triggerWipe();
      return '';
    }
    if(full===HOME&&ctx.cwd===HOME&&!force)return '\x1b[33mrm: refusing to remove $HOME\x1b[0m';
    const n=getNode(full);
    if(!n){if(!force)out+=`rm: cannot remove '${p}': No such file or directory\n`;continue;}
    if(n.type==='dir'&&!rec){out+=`rm: cannot remove '${p}': Is a directory\n`;continue;}
    const {parent,name}=getParent(full);
    if(parent&&parent.ro){out+=`rm: cannot remove '${p}': Read-only file system\n`;continue;}
    if(parent)delete parent.children[name];
  }
  saveFS();
  return out.replace(/\n$/,'');
});
def('cp','files','copy files','cp [-r] <src> <dest>',(args,ctx)=>{
  const rec=args.includes('-r')||args.includes('-R');
  const rest=args.filter(a=>!a.startsWith('-'));
  if(rest.length<2)return 'cp: missing destination file operand';
  const src=getNode(resolvePath(ctx.cwd,rest[0]));
  if(!src)return `cp: cannot stat '${rest[0]}': No such file or directory`;
  if(src.type==='dir'&&!rec)return `cp: -r not specified; omitting directory '${rest[0]}'`;
  let destPath=resolvePath(ctx.cwd,rest[1]);
  const dNode=getNode(destPath);
  if(dNode&&dNode.type==='dir')destPath=destPath+'/'+rest[0].split('/').pop();
  if(src.type==='file'){writeFile(destPath,src.content);const nn=getNode(destPath);if(nn&&src.binary)nn.binary=true;}
  else writeFile(destPath,'');
  saveFS();
  return '';
});
def('mv','files','move files','mv <src> <dest>',(args,ctx)=>{
  if(args.length<2)return 'mv: missing destination file operand';
  const srcPath=resolvePath(ctx.cwd,args[0]);
  const src=getNode(srcPath);
  if(!src)return `mv: cannot stat '${args[0]}': No such file or directory`;
  let destPath=resolvePath(ctx.cwd,args[1]);
  const dNode=getNode(destPath);
  if(dNode&&dNode.type==='dir')destPath=destPath+'/'+args[0].split('/').pop();
  const {parent:sp,name:sn}=getParent(srcPath);
  const {parent:dp,name:dn}=getParent(destPath);
  if(!dp)return `mv: cannot move to '${args[1]}': No such file or directory`;
  if(sp&&sp.ro)return `mv: '${args[0]}': Read-only file system`;
  if(dp.ro)return `mv: '${args[1]}': Read-only file system`;
  dp.children[dn]=src;
  if(sp)delete sp.children[sn];
  saveFS();
  return '';
});
def('stat','files','file status','stat <file>',(args,ctx)=>{

def('file','files','determine file type','file <path...>',(args,ctx)=>{

def('tree','files','directory tree','tree [-a] [path]',(args,ctx)=>{
  const all=args.includes('-a');
  const target=args.find(a=>!a.startsWith('-'))||'.';
  const root=resolvePath(ctx.cwd,target);
  const n=getNode(root);
  if(!n)return 'tree: No such file or directory';
  let dirs=0,files=0;
  function walk(nd,prefix){
    let names=Object.keys(nd.children).sort();
    if(!all)names=names.filter(x=>!x.startsWith('.'));
    let out='';
    names.forEach((name,i)=>{
      const last=i===names.length-1;
      const child=nd.children[name];
      out+=prefix+(last?'└── ':'├── ')+colorName(name,child)+'\n';
      if(child.type==='dir'){dirs++;out+=walk(child,prefix+(last?'    ':'│   '));}
      else files++;
    });
    return out;
  }
  return '\x1b[1;34m'+target+'\x1b[0m\n'+walk(n,'')+`\n${dirs} directories, ${files} files`;
});
def('find','files','find files','find [path] [-name pat] [-type f|d]',(args,ctx)=>{
  let start='.',name=null,type=null;
  for(let i=0;i<args.length;i++){
    if(args[i]==='-name')name=args[++i];
    else if(args[i]==='-type')type=args[++i];
    else if(!args[i].startsWith('-'))start=args[i];
  }
  const root=resolvePath(ctx.cwd,start);
  const n=getNode(root);
  if(!n)return `find: '${start}': No such file or directory`;
  const results=[];
  const rx=name?new RegExp('^'+name.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'):null;
  function walk(nd,path){
    if((!type||(type==='d'&&nd.type==='dir')||(type==='f'&&nd.type==='file'))&&(!rx||rx.test(path.split('/').pop()||'/')))results.push(path);
    if(nd.type==='dir'){for(const k of Object.keys(nd.children).sort())walk(nd.children[k],path==='/'?'/'+k:path+'/'+k);}
  }
  walk(n,root);
  return results.join('\n')||'';
});
def('du','files','disk usage','du [-hs] [path]',(args,ctx)=>{
  const human=args.includes('-h'),summary=args.includes('-s');
  const target=args.find(a=>!a.startsWith('-'))||'.';
  const root=resolvePath(ctx.cwd,target);
  const n=getNode(root);
  if(!n)return `du: cannot access '${target}'`;
  const lines=[];
  function walk(nd,path){
    let total=nd.type==='file'?sizeOf(nd):4096;
    if(nd.type==='dir'){
      for(const k of Object.keys(nd.children))total+=walk(nd.children[k],path+'/'+k);
      if(!summary)lines.push(`${human?humanSize(total):Math.ceil(total/1024)}`.padStart(6)+'\t'+path);
    }
    return total;
  }
  const total=walk(n,root);
  if(summary)lines.push(`${human?humanSize(total):Math.ceil(total/1024)}`.padStart(6)+'\t'+root);
  return lines.join('\n');
});

def('diff','files','compare files','diff <f1> <f2>',(args,ctx)=>{

  const a=getNode(resolvePath(ctx.cwd,args[0]));
  const b=getNode(resolvePath(ctx.cwd,args[1]));
  if(!a||!b)return 'diff: No such file or directory';
  const la=a.content.replace(/\n$/,'').split('\n'),lb=b.content.replace(/\n$/,'').split('\n');
  const out=[];
  const max=Math.max(la.length,lb.length);
  for(let i=0;i<max;i++){
    if(la[i]!==lb[i]){
      out.push(`\x1b[36m${i+1}c${i+1}\x1b[0m`);
      if(la[i]!==undefined)out.push(`\x1b[31m< ${la[i]}\x1b[0m`);
      out.push('\x1b[90m---\x1b[0m');
      if(lb[i]!==undefined)out.push(`\x1b[32m> ${lb[i]}\x1b[0m`);
    }
  }
  return out.join('\n');
});

def('grep','text','search text','grep [-inv] <pat> [file...]',(args,ctx)=>{
  let i=false,v=false,n=false,c=false;
  const rest=[];
  for(const a of args){
    if(a.startsWith('-')&&a.length>1){for(const x of a.slice(1)){if(x==='i')i=true;else if(x==='v')v=true;else if(x==='n')n=true;else if(x==='c')c=true;}}
    else rest.push(a);

async function realGzip(text){
  try{
    const cs=new CompressionStream('gzip');
    const w=cs.writable.getWriter();
    w.write(new TextEncoder().encode(text));
    w.close();
    const buf=await new Response(cs.readable).arrayBuffer();
    return new Uint8Array(buf);
  }catch(e){return null;}
}
async function realGunzip(bytes){
  try{
    const ds=new DecompressionStream('gzip');
    const w=ds.writable.getWriter();
    w.write(bytes);
    w.close();
    const buf=await new Response(ds.readable).arrayBuffer();
    return new TextDecoder().decode(buf);
  }catch(e){return null;}
}
function tarPack(entries){
  const enc=new TextEncoder();
  const blocks=[];
  for(const e of entries){
    const content=typeof e.content==='string'?enc.encode(e.content):e.content;
    const header=new Uint8Array(512);
    header.set(enc.encode(e.name).slice(0,100),0);
    header.set(enc.encode((e.mode||'0000644').padStart(7,'0')+'\0'),100);
    header.set(enc.encode('0001000\0'),108);
    header.set(enc.encode('0001000\0'),116);
    header.set(enc.encode(content.length.toString(8).padStart(11,'0')+'\0'),124);
    header.set(enc.encode(Math.floor(Date.now()/1000).toString(8).padStart(11,'0')+'\0'),136);
    header.set(enc.encode('        '),148);
    header[156]=48;
    header.set(enc.encode('ustar'),257);
    header.set(enc.encode('00'),263);
    let sum=0;for(let i=0;i<512;i++)sum+=header[i];
    header.set(enc.encode(sum.toString(8).padStart(6,'0')+'\0 '),148);
    blocks.push(header);
    const padded=new Uint8Array(Math.ceil(content.length/512)*512);
    padded.set(content);
    blocks.push(padded);
  }
  blocks.push(new Uint8Array(1024));
  const total=blocks.reduce((s,b)=>s+b.length,0);
  const out=new Uint8Array(total);
  let off=0;
  for(const b of blocks){out.set(b,off);off+=b.length;}
  return out;
}
function tarUnpack(bytes){
  const dec=new TextDecoder();

    const header=bytes.slice(off,off+512);
    let zero=true;
    for(let i=0;i<512;i++)if(header[i]){zero=false;break;}
    if(zero)break;
    const name=dec.decode(header.slice(0,100)).replace(/\0.*$/,'');
    if(!name)break;
    const size=parseInt(dec.decode(header.slice(124,136)).replace(/\0.*$/,'').trim(),8)||0;
    off+=512;
    entries.push({name,content:bytes.slice(off,off+size)});
    off+=Math.ceil(size/512)*512;
  }

}
def('gzip','archive','compress with gzip','gzip <file>',async(args,ctx)=>{
  if(!args.length)return 'gzip: missing file operand';
  const out=[];
  for(const f of args){
    const path=resolvePath(ctx.cwd,f);
    const n=getNode(path);
    if(!n||n.type!=='file'){out.push(`gzip: ${f}: No such file`);continue;}
    const bytes=await realGzip(n.content);
    if(!bytes){out.push(`gzip: ${f}: CompressionStream unavailable`);continue;}
    const outName=f+'.gz';
    const outPath=resolvePath(ctx.cwd,outName);
    const {parent,name}=getParent(outPath);
    if(parent){
      let b64='';
      const chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
      b64=btoa(b64);
      parent.children[name]=F(b64,{binary:true,mtime:Date.now()});
      const {parent:sp,name:sn}=getParent(path);
      if(sp)delete sp.children[sn];
      out.push(`${f} → ${outName}  \x1b[90m(${n.content.length} → ${bytes.length} bytes)\x1b[0m`);
    }
  }
  saveFS();
  return out.join('\n');
});
def('gunzip','archive','decompress gzip','gunzip <file.gz>',async(args,ctx)=>{
  if(!args.length)return 'gunzip: missing file operand';
  const out=[];
  for(const f of args){
    const path=resolvePath(ctx.cwd,f);
    const n=getNode(path);
    if(!n||n.type!=='file'){out.push(`gunzip: ${f}: No such file`);continue;}
    if(!n.binary){out.push(`gunzip: ${f}: not a gzip file`);continue;}
    const bin=atob(n.content);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const text=await realGunzip(arr);
    if(text===null){out.push(`gunzip: ${f}: invalid gzip data`);continue;}
    const outName=f.replace(/\.gz$/,'')||f+'.out';
    writeFile(resolvePath(ctx.cwd,outName),text);
    const {parent,name}=getParent(path);
    if(parent)delete parent.children[name];
    out.push(`${f} → ${outName}`);
  }
  saveFS();
  return out.join('\n');
});
def('tar','archive','tar archive','tar [-cxt] [-f archive] [files...]',async(args,ctx)=>{
  let create=false,extract=false,list=false,archive=null;
  const files=[];
  for(let i=0;i<args.length;i++){
    const a=args[i];
    if(a==='-cf'||a==='-xf'||a==='-tf'){create=a[1]==='c';extract=a[1]==='x';list=a[1]==='t';archive=args[++i];continue;}
    if(a==='-f'){archive=args[++i];continue;}
    if(a.startsWith('-')){for(const c of a.slice(1)){if(c==='c')create=true;else if(c==='x')extract=true;else if(c==='t')list=true;}}
    else files.push(a);
  }
  if(!create&&!extract&&!list)return 'tar: You must specify one of -c, -x, -t';
  if(!archive)return 'tar: option -f requires an argument';
  const archivePath=resolvePath(ctx.cwd,archive);
  if(create){
    if(!files.length)files.push('.');
    const entries=[];
    function add(path,name){
      const n=getNode(path);
      if(!n)return;
      if(n.type==='file'){
        if(n.binary){
          const bin=atob(n.content);
          const arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
          entries.push({name:name.replace(/^\//,''),content:arr});
        }else entries.push({name:name.replace(/^\//,''),content:n.content});
      }else if(n.type==='dir'){
        for(const k of Object.keys(n.children))add(path+'/'+k,name+'/'+k);
      }
    }
    for(const f of files){const p=resolvePath(ctx.cwd,f);add(p,f.replace(/^\.\//,''));}
    const bytes=tarPack(entries);
    let b64='';
    const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk)b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
    b64=btoa(b64);
    const {parent,name}=getParent(archivePath);
    if(parent)parent.children[name]=F(b64,{binary:true,mtime:Date.now()});
    saveFS();
    return entries.map(e=>e.name).join('\n')+`\n\x1b[90m(created ${archive}, ${bytes.length} bytes, ${entries.length} entries)\x1b[0m`;
  }
  const an=getNode(archivePath);
  if(!an)return `tar: ${archive}: Cannot open: No such file or directory`;
  if(!an.binary)return `tar: ${archive}: not a tar archive`;
  const bin=atob(an.content);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const entries=tarUnpack(arr);
  if(list)return entries.map(e=>e.name).join('\n');
  if(extract){
    for(const e of entries){
      const dest=resolvePath(ctx.cwd,e.name);
      const isText=!/[\x00-\x08\x0E-\x1F]/.test(Array.from(e.content.slice(0,512)).map(b=>String.fromCharCode(b)).join(''));
      if(isText)writeFile(dest,new TextDecoder().decode(e.content));
      else{
        let b64='';
        for(let i=0;i<e.content.length;i+=0x8000)b64+=String.fromCharCode.apply(null,e.content.subarray(i,i+0x8000));
        b64=btoa(b64);
        const {parent,name}=getParent(dest);
        if(parent)parent.children[name]=F(b64,{binary:true,mtime:Date.now()});
      }
    }
    saveFS();
    return entries.map(e=>e.name).join('\n');
  }
  return '';
});

async function realFetch(url,opts){
  opts=opts||{};
  const timeout=opts.timeout||15000;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  const t0=performance.now();
  try{
    const res=await fetch(url,{signal:controller.signal,method:opts.method||'GET',headers:opts.headers||{},redirect:'follow',mode:'cors'});
    clearTimeout(timer);
    const dt=performance.now()-t0;
    const headers={};
    res.headers.forEach((v,k)=>{headers[k]=v;});
    const text=await res.text();
    return {ok:true,status:res.status,statusText:res.statusText,headers,text,time:dt,url:res.url};
  }catch(e){
    clearTimeout(timer);
    const dt=performance.now()-t0;
    let msg=e&&e.message?e.message:String(e);
    if(e.name==='AbortError')msg='Operation timed out after '+timeout+'ms';
    return {ok:false,error:msg,time:dt,cors:/cors|failed to fetch/i.test(msg)};
  }
}
async function fetchWithFallback(url,opts){
  let r=await realFetch(url,opts);
  if(r.ok)return r;
  if(!r.cors)return r;
  try{
    const prox='https://api.allorigins.win/raw?url='+encodeURIComponent(url);
    const r2=await realFetch(prox,opts);
    if(r2.ok){r2.proxied=true;r2.proxyName='api.allorigins.win';return r2;}
  }catch(e){}
  try{
    const prox='https://r.jina.ai/'+url;
    const r3=await realFetch(prox,opts);
    if(r3.ok){r3.proxied=true;r3.proxyName='r.jina.ai';return r3;}
  }catch(e){}
  return r;
}
def('curl','net','transfer a URL','curl [-sS] <url>',async(args)=>{
  const url=args.find(a=>!a.startsWith('-'));
  if(!url)return "curl: try 'curl --help' for more information";
  const silent=args.includes('-s');
  const full=url.startsWith('http')?url:'https://'+url;
  const r=await fetchWithFallback(full,{timeout:20000});
  if(!r.ok){
    return `curl: (7) Failed to connect: ${r.error}\n\x1b[90m(elapsed ${r.time.toFixed(0)}ms)\x1b[0m`;
  }
  let out='';
  if(!silent){
    out+=`\x1b[90m*   Trying ${new URL(r.url).hostname}...\x1b[0m\n`;
    out+=`\x1b[90m* Connected (${r.time.toFixed(0)}ms)\x1b[0m\n`;
    out+=`\x1b[90m< HTTP/1.1 ${r.status} ${r.statusText}\x1b[0m\n`;
    if(r.proxied)out+=`\x1b[90m* via CORS proxy: ${r.proxyName}\x1b[0m\n`;
    out+='\n';
  }
  out+=r.text;
  return out;
});

def('ping','net','HTTP round-trip test','ping [-c N] <host>',async(args)=>{
  let count=4;
  const ci=args.indexOf('-c');
  if(ci>=0){count=parseInt(args[ci+1],10)||4;args=args.filter((a,i)=>i!==ci&&i!==ci+1);}
  const host=args[0]||'localhost';
  const hostname=host.split('/')[0];
  const url=host.startsWith('http')?host:'https://'+hostname;
  const out=[`PING ${hostname} — HTTP round-trip test`];
  const times=[];
  let lost=0;
  for(let i=0;i<Math.min(count,6);i++){
    const r=await realFetch(url,{timeout:5000,method:'HEAD'});
    if(r.ok){
      times.push(r.time);
      out.push(`seq=${i+1} time=${r.time.toFixed(1)} ms  status=${r.status}`);
    }else{
      lost++;
      out.push(`seq=${i+1} \x1b[31mtimeout\x1b[0m`);
    }
  }
  out.push('');
  out.push(`--- ${hostname} statistics ---`);
  const recv=times.length;
  out.push(`${Math.min(count,6)} transmitted, ${recv} received, ${(lost/Math.min(count,6)*100).toFixed(0)}% packet loss`);
  if(times.length){
    out.push(`rtt min/avg/max = ${Math.min(...times).toFixed(1)}/${(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)}/${Math.max(...times).toFixed(1)} ms`);
  }
  return out.join('\n');
});

function evalJS(code,ctx,filename,extraArgs){
  const lines=[];
  const argv=filename?['node',filename,...(extraArgs||[])]:['node',...(extraArgs||[])];
  function fmtArgs(a){
    return a.map(x=>{
      if(x===undefined)return 'undefined';
      if(x===null)return 'null';
      if(typeof x==='string')return x;
      if(typeof x==='object'){try{return JSON.stringify(x);}catch(e){return String(x);}}
      return String(x);
    }).join(' ');
  }
  const fakeConsole={
    log:(...a)=>lines.push(fmtArgs(a)),
    error:(...a)=>lines.push('\x1b[31m'+fmtArgs(a)+'\x1b[0m'),
    warn:(...a)=>lines.push('\x1b[33m'+fmtArgs(a)+'\x1b[0m'),
    info:(...a)=>lines.push(fmtArgs(a)),
    debug:()=>{},trace:()=>{}
  };
  const fakeProcess={
    argv,env:state.env,cwd:()=>ctx.cwd,
    exit:(c)=>{throw{__exit:true,code:c||0};},
    platform:'renderedos',version:'v22.4.1',
    versions:{node:'22.4.1',v8:'12.4.254.21'},
    stdout:{write:s=>{const t=String(s);lines.push(t.endsWith('\n')?t.slice(0,-1):t);}},
    stderr:{write:s=>{const t=String(s);lines.push('\x1b[31m'+(t.endsWith('\n')?t.slice(0,-1):t)+'\x1b[0m');}},
    nextTick:(fn)=>setTimeout(fn,0)
  };
  const fakeRequire=(name)=>{
    if(name==='fs')return{
      readFileSync:(p)=>{const n=getNode(resolvePath(ctx.cwd,p));return n&&n.type==='file'?n.content:'';},
      writeFileSync:(p,c)=>writeFile(resolvePath(ctx.cwd,p),String(c)),
      existsSync:(p)=>!!getNode(resolvePath(ctx.cwd,p)),
      readdirSync:(p)=>{const n=getNode(resolvePath(ctx.cwd,p));return n&&n.type==='dir'?Object.keys(n.children):[];},
      statSync:(p)=>{const n=getNode(resolvePath(ctx.cwd,p));return n?{isDirectory:()=>n.type==='dir',isFile:()=>n.type==='file',size:sizeOf(n),mtime:new Date(n.mtime)}:null;}
    };
    if(name==='path')return{
      join:(...a)=>a.join('/').replace(/\/+/g,'/'),
      basename:(p)=>String(p).split('/').pop(),
      dirname:(p)=>String(p).split('/').slice(0,-1).join('/')||'.',
      resolve:(...a)=>resolvePath(ctx.cwd,a.join('/'))
    };
    if(name==='os')return{
      hostname:()=>state.host,platform:()=>'renderedos',
      cpus:()=>[{model:'Rendered Virtual Core',speed:3600}],
      totalmem:()=>16384*1024*1024,
      freemem:()=>13842*1024*1024,
      uptime:()=>Math.floor(performance.now()/1000)
    };
    if(name==='process')return fakeProcess;
    return {};
  };
  try{
    const fn=new Function('console','process','require','module','exports','__filename','__dirname','"use strict";\n'+code);
    const moduleObj={exports:{}};
    fn(fakeConsole,fakeProcess,fakeRequire,moduleObj,moduleObj.exports,filename||'[eval]',ctx.cwd);
    return lines.join('\n');
  }catch(e){
    if(e&&e.__exit)return lines.join('\n');
    const msg=e&&e.message?e.message:String(e);
    const stack=(e&&e.stack?e.stack:'').split('\n').filter(l=>!l.includes('at new Function')&&!l.includes('at evalJS')).slice(0,4).join('\n');
    return lines.join('\n')+(lines.length?'\n':'')+`\x1b[31m${msg}\x1b[0m\n\x1b[90m${stack||'    at '+(filename||'[eval]')}\x1b[0m`;
  }
}
def('node','dev','Node.js runtime (real evaluation)','node [file] [-e "code"] [args]',async(args,ctx)=>{
  if(args[0]==='--version'||args[0]==='-v')return 'v22.4.1';
  if(args[0]==='-e'){
    const code=args.slice(1).join(' ');
    if(!code)return 'node: -e requires an argument';
    return evalJS(code,ctx,null,[]);

function evalPython(code){
  const lines=[];
  const fakePrint=(...a)=>lines.push(a.map(x=>{
    if(x===undefined)return 'None';
    if(x===null)return 'None';
    if(typeof x==='string')return x;
    if(typeof x==='object'){try{return JSON.stringify(x);}catch(e){return String(x);}}
    return String(x);
  }).join(' '));
  try{
    let js=code;
    js=js.replace(/print\s*\(/g,'__print(');
    js=js.replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null');
    js=js.replace(/#[^\n]*/g,'');
    js=js.replace(/def\s+(\w+)\s*\(([^)]*)\)\s*:/g,'function $1($2) {');
    const fn=new Function('__print','"use strict";\n'+js);

}

let nanoOpen=false;
function openNano(filename,initialContent){
  nanoOpen=true;
  const overlay=document.getElementById('nano');
  const title=document.getElementById('nano-title');
  const modEl=document.getElementById('nano-modified');
  const gutter=document.getElementById('nano-gutter');
  const textEl=document.getElementById('nano-text');
  const statusEl=document.getElementById('nano-status');
  let lines=initialContent.replace(/\n$/,'').split('\n');
  if(lines.length===1&&lines[0]==='')lines=[''];
  let row=0,col=0,dirty=false,kill='',scroll=0;
  title.textContent=filename||'[New Buffer]';
  function render(){
    const h=Math.max(10,Math.floor((window.innerHeight-140)/21));
    if(row<scroll)scroll=row;
    if(row>=scroll+h)scroll=row-h+1;
    const vis=lines.slice(scroll,scroll+h);
    gutter.innerHTML=vis.map((_,i)=>String(scroll+i+1).padStart(4)).join('\n');
    textEl.innerHTML=vis.map((l,i)=>{
      const r=scroll+i;
      if(r!==row)return escHtml(l);
      return escHtml(l.slice(0,col))+'<span class="cursor">'+escHtml(l[col]||' ')+'</span>'+escHtml(l.slice(col+1));
    }).join('\n');
    statusEl.textContent=`  ${filename}  ·  Ln ${row+1}, Col ${col+1}  ·  ${lines.length} lines${dirty?'  ·  [modified]':''}`;
    modEl.textContent=dirty?'modified':'';
  }
  function save(){
    const content=lines.join('\n')+(lines.length?'\n':'');
    if(writeFile(resolvePath(state.cwd,filename),content)){dirty=false;saveFS();render();}
  }
  function close(){overlay.classList.remove('visible');nanoOpen=false;document.removeEventListener('keydown',onKey);inputEl.focus();}
  function onKey(e){
    if(!nanoOpen)return;
    const ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='s'){e.preventDefault();save();return;}
    if(ctrl&&e.key==='x'){e.preventDefault();if(dirty)save();close();return;}
    if(e.key==='Enter'){e.preventDefault();const a=lines[row].slice(0,col),b=lines[row].slice(col);lines[row]=a;lines.splice(row+1,0,b);row++;col=0;dirty=true;render();return;}
    if(e.key==='Backspace'){e.preventDefault();if(col>0){lines[row]=lines[row].slice(0,col-1)+lines[row].slice(col);col--;dirty=true;}else if(row>0){col=lines[row-1].length;lines[row-1]+=lines[row];lines.splice(row,1);row--;dirty=true;}render();return;}
    if(e.key==='ArrowLeft'){e.preventDefault();if(col>0)col--;else if(row>0){row--;col=lines[row].length;}render();return;}
    if(e.key==='ArrowRight'){e.preventDefault();if(col<lines[row].length)col++;else if(row<lines.length-1){row++;col=0;}render();return;}
    if(e.key==='ArrowUp'){e.preventDefault();if(row>0){row--;col=Math.min(col,lines[row].length);}render();return;}
    if(e.key==='ArrowDown'){e.preventDefault();if(row<lines.length-1){row++;col=Math.min(col,lines[row].length);}render();return;}
    if(e.key==='Tab'){e.preventDefault();lines[row]=lines[row].slice(0,col)+'  '+lines[row].slice(col);col+=2;dirty=true;render();return;}
    if(e.key==='Escape'){e.preventDefault();close();return;}
    if(e.key.length===1&&!ctrl){e.preventDefault();lines[row]=lines[row].slice(0,col)+e.key+lines[row].slice(col);col++;dirty=true;render();return;}
  }
  overlay.classList.add('visible');
  document.addEventListener('keydown',onKey);
  render();
  inputEl.blur();
}

function tokenize(str){
  const tokens=[];
  let cur='',quote=null,i=0;
  while(i<str.length){
    const c=str[i];
    if(quote){
      if(c===quote){quote=null;i++;continue;}
      if(c==='\\'&&quote==='"'&&i+1<str.length){cur+=str[i+1];i+=2;continue;}
      cur+=c;i++;continue;
    }
    if(c==='"'||c==="'"){quote=c;i++;continue;}
    if(c==='\\'&&i+1<str.length){cur+=str[i+1];i+=2;continue;}
    if(c===' '||c==='\t'){if(cur!==''){tokens.push(cur);cur='';}i++;continue;}
    if(c==='|'||c==='>'||c==='&'||c===';'){
      if(cur!==''){tokens.push(cur);cur='';}
      if(c==='>'&&str[i+1]==='>'){tokens.push('>>');i+=2;continue;}
      if(c==='&'&&str[i+1]==='&'){tokens.push('&&');i+=2;continue;}
      if(c==='|'&&str[i+1]==='|'){tokens.push('||');i+=2;continue;}
      tokens.push(c);i++;continue;
    }
    cur+=c;i++;
  }
  if(cur!=='')tokens.push(cur);
  return tokens;
}
function splitRedirect(tokens){
  let redirect=null;
  const out=[];
  for(let i=0;i<tokens.length;i++){
    if(tokens[i]==='>'||tokens[i]==='>>'){redirect={mode:tokens[i],file:tokens[i+1]};i++;}
    else out.push(tokens[i]);
  }
  return {tokens:out,redirect};
}
function applyAlias(tokens){
  if(!tokens.length)return tokens;
  const a=state.aliases[tokens[0]];
  if(!a)return tokens;
  return tokenize(a).concat(tokens.slice(1));
}

async function runStage(tokens,stdin,opts){
  opts=opts||{};
  tokens=applyAlias(tokens);
  if(!tokens.length)return {stdout:'',code:0};
  const name=tokens[0];
  const args=tokens.slice(1);

  /* Recovery mode: strict allowlist */
  if(state.mode==='recovery'&&!RECOVERY_ALLOW.has(name)){
    return {stdout:`rsh: ${name}: not available in recovery mode`,code:127};
  }

  /* Builtins always work */
  if(BUILTINS.has(name)){
    const c=CMDS[name];
    if(!c)return {stdout:`rsh: ${name}: builtin not implemented`,code:127};
    if(args[0]==='--help')return {stdout:manPage(c),code:0};
    const ctx={cwd:state.cwd,stdin:stdin||'',state,print,clear:clearScreen,sleep,live:makeLive,sudo:!!opts.sudo};
    try{
      let res=c.fn(args,ctx);
      if(res&&typeof res.then==='function')res=await res;
      let out=res==null?'':String(res);
      if(out&&!out.endsWith('\n'))out+='\n';
      return {stdout:out,code:0};
    }catch(err){
      return {stdout:`\x1b[31m${name}: ${err&&err.message?err.message:'error'}\x1b[0m`,code:1};
    }
  }

  /* External command: must have a binary on disk */
  const bin=findBinary(name);
  if(!bin){
    return {stdout:`rsh: ${name}: command not found\n\x1b[90m(the binary /bin/${name} is missing — try 'install' to restore)\x1b[0m`,code:127};
  }

  const c=CMDS[name];
  if(!c){
    return {stdout:`rsh: ${name}: binary exists but command is not implemented`,code:127};
  }
  if(args[0]==='--help')return {stdout:manPage(c),code:0};

  const ctx={cwd:state.cwd,stdin:stdin||'',state,print,clear:clearScreen,sleep,live:makeLive,sudo:!!opts.sudo};
  try{
    let res=c.fn(args,ctx);
    if(res&&typeof res.then==='function')res=await res;
    let out=res==null?'':String(res);
    if(out&&!out.endsWith('\n'))out+='\n';
    return {stdout:out,code:0};
  }catch(err){
    return {stdout:`\x1b[31m${name}: ${err&&err.message?err.message:'error'}\x1b[0m`,code:1};
  }
}

async function execPipeline(stageTokens){
  const stages=[];
  let cur=[];
  for(const t of stageTokens){if(t==='|'){stages.push(cur);cur=[];}else cur.push(t);}
  stages.push(cur);

  let stdin='',code=0;
  for(let i=0;i<stages.length;i++){
    const {tokens,redirect}=splitRedirect(stages[i]);
    const isLast=i===stages.length-1;
    if(!tokens.length){stdin='';continue;}
    const res=await runStage(tokens,stdin);
    code=res.code;
    if(redirect){
      const path=resolvePath(state.cwd,redirect.file);
      const ok=writeFile(path,res.stdout,redirect.mode==='>>');
      if(ok)saveFS();
      else print(`rsh: ${redirect.file}: cannot write`);
      stdin='';
    }else if(isLast){
      if(res.stdout)print(res.stdout);
      stdin='';
    }else{
      stdin=res.stdout;
    }
  }
  return code;
}
async function execLine(line){
  const tokens=tokenize(line);
  if(!tokens.length)return 0;
  const segments=[],ops=[];
  let cur=[];
  for(const t of tokens){
    if(t===';'||t==='&&'||t==='||'){segments.push(cur);ops.push(t);cur=[];}
    else cur.push(t);
  }
  segments.push(cur);
  let code=0;
  for(let i=0;i<segments.length;i++){
    if(i>0){
      const op=ops[i-1];
      if(op==='&&'&&code!==0)continue;
      if(op==='||'&&code===0)continue;
    }
    code=await execPipeline(segments[i]);
  }
  return code;
}
async function captureOutput(line,opts){
  opts=opts||{};
  const tokens=tokenize(line);
  const stages=[];
  let cur=[];
  for(const t of tokens){if(t==='|'){stages.push(cur);cur=[];}else cur.push(t);}
  stages.push(cur);
  let stdin='',out='';
  for(const s of stages){
    const {tokens:tk}=splitRedirect(s);
    if(!tk.length)continue;
    const res=await runStage(tk,stdin,opts);
    stdin=res.stdout;
    out=res.stdout;
  }
  return out.replace(/\n$/,'');
}

/* ═══════════════════════════════════════════════════════════
   PROMPT / INPUT
   ═══════════════════════════════════════════════════════════ */
function promptText(){
  if(state.mode==='recovery')return '\x1b[1;31mrecovery\x1b[0m \x1b[1;33m#\x1b[0m ';
  let p=state.cwd;
  if(p===HOME)p='~';
  else if(p.startsWith(HOME+'/'))p='~'+p.slice(HOME.length);
  return `\x1b[1;32m${state.user}\x1b[0m@\x1b[1;32m${state.host}\x1b[0m:\x1b[1;34m${p}\x1b[0m$ `;
}
function refreshPrompt(){promptEl.innerHTML=renderAnsi(promptText());}

function complete(){
  const value=inputEl.value,caret=inputEl.selectionStart,before=value.slice(0,caret);
  const parts=before.split(/\s+/);
  if(parts.length<=1){
    const frag=parts[0]||'';
    const names=[...new Set(Object.keys(CMDS).concat(Object.keys(state.aliases)))].sort();
    const hits=names.filter(n=>n.startsWith(frag));
    if(hits.length===1){inputEl.value=hits[0]+' '+value.slice(caret);inputEl.selectionStart=inputEl.selectionEnd=hits[0].length+1;}
    else if(hits.length>1){print(hits.join('   '));refreshPrompt();}
    return;
  }
  const frag=parts[parts.length-1];
  const slash=frag.lastIndexOf('/');
  const dirPart=slash>=0?frag.slice(0,slash+1):'';
  const namePart=slash>=0?frag.slice(slash+1):frag;
  const dirPath=resolvePath(state.cwd,dirPart||'.');
  const dir=getNode(dirPath);
  if(!dir||dir.type!=='dir')return;
  const hits=Object.keys(dir.children).filter(n=>n.startsWith(namePart)&&(!namePart.startsWith('.')||n.startsWith('.'))).sort();
  if(hits.length===1){
    const suffix=dir.children[hits[0]].type==='dir'?'/':' ';
    const newFrag=dirPart+hits[0]+suffix;
    inputEl.value=value.slice(0,caret-frag.length)+newFrag+value.slice(caret);
    inputEl.selectionStart=inputEl.selectionEnd=caret-frag.length+newFrag.length;
  }else if(hits.length>1){
    print(hits.map(h=>dir.children[h].type==='dir'?h+'/':h).join('   '));
    refreshPrompt();
  }
}

let busy=false;
async function handleSubmit(){
  const line=inputEl.value;
  inputEl.value='';

  if(state.inputMode==='wipe-confirm'){
    print('> '+line);
    print('');
    const norm=line.trim().toLowerCase();
    if(norm==='you asked for it'||norm==='that'||norm==='hat'){
      await doReinstall();
    }else{
      print('\x1b[90mThat is not what you were asked to type.\x1b[0m');
      print('');
      print('\x1b[1;37mType that.\x1b[0m');
    }
    return;
  }
  if(state.inputMode==='wipe-pending')return;
  if(!state.running)return;

  print(promptText()+line);
  if(!line.trim()){refreshPrompt();return;}
  state.history.push(line);
  state.histIndex=state.history.length;
  if(state.mode==='running')saveShellState();
  busy=true;
  try{await execLine(line);}
  catch(e){print('\x1b[31mrsh: internal error: '+(e&&e.message)+'\x1b[0m');}
  busy=false;
  if(state.inputMode)return;
  if(!state.running)return;
  refreshPrompt();
  scrollBottom();
  inputEl.focus();
}
inputEl.addEventListener('keydown',async(e)=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(busy)return;
    await handleSubmit();
    return;
  }
  if(state.inputMode)return;
  if(!state.running)return;
  if(e.key==='ArrowUp'){e.preventDefault();if(!state.history.length)return;state.histIndex=Math.max(0,state.histIndex-1);inputEl.value=state.history[state.histIndex]||'';return;}
  if(e.key==='ArrowDown'){e.preventDefault();if(!state.history.length)return;state.histIndex=Math.min(state.history.length,state.histIndex+1);inputEl.value=state.history[state.histIndex]||'';return;}
  if(e.key==='Tab'){e.preventDefault();complete();return;}
  if(e.ctrlKey&&e.key==='l'){e.preventDefault();clearScreen();refreshPrompt();return;}
  if(e.ctrlKey&&e.key==='c'){e.preventDefault();print(promptText()+inputEl.value+'\x1b[31m^C\x1b[0m');inputEl.value='';refreshPrompt();return;}
  if(e.ctrlKey&&e.key==='u'){e.preventDefault();inputEl.value='';return;}
});
document.addEventListener('click',(e)=>{
  if(nanoOpen)return;
  if(state.inputMode)return;
  if(!state.running)return;
  if(window.getSelection&&String(window.getSelection()).length)return;
  if(e.target.tagName!=='INPUT')inputEl.focus();
});

/* ═══════════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════════ */
async function main(){
  const restored=loadFS();
  if(!restored){
    FS=defaultFS();
    ensureBins();
    saveFS();
  }else{
    /* Migration: ensure /bin has stubs for every command. Only adds missing. */
    /* If user deleted /bin/curl, findBinary returns null and it stays gone. */
  }
  loadShellState();
  state.env.PWD=state.cwd;

  try{
    await bootSystem();
  }catch(e){
    clearScreen();
    print('\x1b[31mRenderedOS failed to boot.\x1b[0m');
    print('');
    print(String(e&&e.stack?e.stack:e));
    print('');
    print('Open the browser console for details.');
  }
}
main();
